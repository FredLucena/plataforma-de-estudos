<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Plataforma de Estudos — Meus Cursos</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#0B0E14;
    --bg-2:#0F131B;
    --panel:#141923;
    --panel-2:#191F2B;
    --elevated:#1C2330;
    --line:#262E3C;
    --line-soft:#1E2531;
    --ink:#EEF2F8;
    --ink-2:#AEB9C9;
    --muted:#6B7688;
    --accent:#39D6C4;
    --accent-2:#4DA8FF;
    --accent-glow:rgba(57,214,196,.35);
    --topbar-bg:rgba(11,14,20,.72);
    --dot:rgba(255,255,255,.035);
    --track:#0C1018;
    --av-grad:linear-gradient(135deg,#2A3344,#1A212D);
    --glow-1:rgba(77,168,255,.16);
    --glow-2:rgba(57,214,196,.12);
    --radius:16px;
    --display:'Bricolage Grotesque',sans-serif;
    --body:'Hanken Grotesk',sans-serif;
  }

  /* ── light theme ── */
  body.light{
    --bg:#EDF1F6;
    --bg-2:#F5F8FB;
    --panel:#FFFFFF;
    --panel-2:#F1F5F9;
    --elevated:#FFFFFF;
    --line:#E1E8F0;
    --line-soft:#EBEFF4;
    --ink:#1B2430;
    --ink-2:#48566A;
    --muted:#8794A5;
    --accent:#10AE9B;
    --accent-2:#2D8FE6;
    --accent-glow:rgba(16,174,155,.3);
    --topbar-bg:rgba(255,255,255,.78);
    --dot:rgba(20,30,45,.04);
    --track:#E6ECF2;
    --av-grad:linear-gradient(135deg,#E8EEF5,#DCE5EF);
    --glow-1:rgba(45,143,230,.12);
    --glow-2:rgba(16,174,155,.1);
  }
  body{transition:background-color .35s ease,color .35s ease;}
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  ::selection{background:var(--accent);color:#04201C;}
  body{
    font-family:var(--body);
    background:var(--bg);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    display:flex;flex-direction:column;min-height:100vh;
    position:relative;overflow-x:hidden;
  }
  /* atmosphere */
  body::before{
    content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
    background:
      radial-gradient(60% 50% at 78% -5%, var(--glow-1), transparent 60%),
      radial-gradient(55% 45% at 8% 8%, var(--glow-2), transparent 60%);
  }
  body::after{
    content:"";position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.5;
    background-image:radial-gradient(var(--dot) 1px, transparent 1px);
    background-size:3px 3px;
  }
  .topbar,.shell{position:relative;z-index:1;}

  /* ── top bar ── */
  .topbar{
    height:66px;flex:none;
    background:var(--topbar-bg);
    backdrop-filter:blur(14px);
    border-bottom:1px solid var(--line-soft);
    display:flex;align-items:center;justify-content:space-between;
    padding:0 30px;
    position:sticky;top:0;z-index:20;
  }
  .brand{display:flex;align-items:center;gap:13px;}
  .brand-mark{
    width:38px;height:38px;border-radius:11px;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));
    display:flex;align-items:center;justify-content:center;flex:none;
    box-shadow:0 6px 20px -6px var(--accent-glow);
  }
  .brand-txt{line-height:1.05;}
  .brand-txt small{display:block;font-size:9px;letter-spacing:.34em;font-weight:700;color:var(--muted);white-space:nowrap;margin-bottom:3px;}
  .brand-txt strong{display:block;font-family:var(--display);font-size:18px;letter-spacing:.02em;font-weight:800;white-space:nowrap;color:var(--ink);}
  .top-right{display:flex;align-items:center;gap:10px;}
  .top-link{
    display:flex;align-items:center;gap:9px;font-size:12px;font-weight:700;letter-spacing:.08em;
    color:var(--ink-2);cursor:pointer;padding:9px 15px;border-radius:99px;
    border:1px solid var(--line);transition:.18s;
  }
  .top-link:hover{color:var(--ink);border-color:var(--accent);background:rgba(57,214,196,.06);}
  .top-avatar{
    width:38px;height:38px;border-radius:50%;
    background:var(--panel-2);color:var(--accent);
    display:flex;align-items:center;justify-content:center;
    border:1px solid var(--line);cursor:pointer;transition:.18s;
  }
  .top-avatar:hover{border-color:var(--accent);}
  .theme-toggle{
    width:38px;height:38px;border-radius:50%;flex:none;
    background:var(--panel-2);color:var(--ink-2);
    display:flex;align-items:center;justify-content:center;
    border:1px solid var(--line);cursor:pointer;transition:.18s;position:relative;overflow:hidden;
  }
  .theme-toggle:hover{color:var(--accent);border-color:var(--accent);background:rgba(57,214,196,.06);}
  .theme-toggle svg{position:absolute;transition:transform .4s cubic-bezier(.4,1.4,.5,1),opacity .25s;}
  .theme-toggle .i-sun{transform:rotate(-90deg) scale(.4);opacity:0;}
  .theme-toggle .i-moon{transform:rotate(0) scale(1);opacity:1;}
  body.light .theme-toggle .i-sun{transform:rotate(0) scale(1);opacity:1;}
  body.light .theme-toggle .i-moon{transform:rotate(90deg) scale(.4);opacity:0;}

  /* ── shell ── */
  .shell{flex:1;display:flex;min-height:0;}

  /* ── sidebar (trilha de ícones expansível) ── */
  .sidebar{
    width:78px;flex:none;position:relative;z-index:40;
  }
  .sidebar-inner{
    position:absolute;top:0;left:0;bottom:0;width:78px;overflow:hidden;
    background:linear-gradient(180deg,var(--bg-2),var(--bg));
    border-right:1px solid var(--line-soft);
    padding:22px 16px;display:flex;flex-direction:column;
    transition:width .3s cubic-bezier(.2,.8,.2,1),box-shadow .3s;
  }
  /* expandir: controlado por JS via classe .open (hover no desktop, toque no mobile) */
  .sidebar.open .sidebar-inner{width:252px;box-shadow:10px 0 40px -18px rgba(0,0,0,.6);}
  .sidebar.open .reveal{opacity:1;pointer-events:auto;}
  .sidebar.open .user{justify-content:flex-start;}
  .sidebar.open .nav-item{justify-content:flex-start;gap:14px;}
  .sidebar.open .rail-toggle svg{transform:rotate(180deg);}

  /* elementos que só aparecem quando expandida */
  .reveal{max-width:0;max-height:0;opacity:0;overflow:hidden;pointer-events:none;white-space:nowrap;transition:max-width .28s cubic-bezier(.2,.8,.2,1),max-height .28s cubic-bezier(.2,.8,.2,1),opacity .2s ease;}
  .sidebar.open .reveal{max-width:220px;max-height:200px;opacity:1;pointer-events:auto;}

  .user{
    display:flex;align-items:center;justify-content:center;gap:0;padding:7px;margin-bottom:18px;
    background:var(--panel);border:1px solid var(--line);border-radius:14px;transition:padding .25s,gap .25s;
  }
  .sidebar.open .user{padding:14px;gap:13px;}
  .user-av{
    width:46px;height:46px;border-radius:13px;flex:none;
    background:var(--av-grad);
    color:var(--accent);
    display:flex;align-items:center;justify-content:center;
    border:1px solid var(--line);position:relative;
  }
  .user-av::after{
    content:"";position:absolute;right:-2px;bottom:-2px;width:12px;height:12px;border-radius:50%;
    background:var(--accent);border:2.5px solid var(--panel);
  }
  .user-meta{line-height:1.3;}
  .user-meta strong{display:block;font-family:var(--display);font-size:15px;font-weight:700;white-space:nowrap;}
  .user-meta span{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted);font-weight:600;margin-top:2px;}
  .user-meta span::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--accent);}

  .nav-label{font-size:10px;font-weight:700;letter-spacing:.22em;color:var(--muted);padding:0 12px 10px;white-space:nowrap;}
  .nav{display:flex;flex-direction:column;gap:3px;}
  .nav-item{
    display:flex;align-items:center;justify-content:center;gap:0;padding:12px 14px;border:none;background:none;
    border-radius:11px;font-family:inherit;font-size:13px;font-weight:600;letter-spacing:.03em;
    color:var(--ink-2);cursor:pointer;text-align:left;width:100%;transition:.16s;white-space:nowrap;
    position:relative;
  }
  .nav-item svg{flex:none;color:var(--muted);transition:.16s;}
  .nav-item:hover{background:var(--panel);color:var(--ink);}
  .nav-item:hover svg{color:var(--ink-2);}
  .nav-item.active{
    background:linear-gradient(90deg,rgba(57,214,196,.14),rgba(57,214,196,.02));
    color:var(--accent);
  }
  .nav-item.active svg{color:var(--accent);}
  .nav-item.active::before{
    content:"";position:absolute;left:0;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--accent);
  }
  .sidebar-foot{margin-top:auto;padding-top:18px;}
  .promo{
    background:linear-gradient(150deg,var(--panel-2),var(--panel));
    border:1px solid var(--line);border-radius:14px;padding:16px;overflow:hidden;position:relative;
  }
  .promo::before{
    content:"";position:absolute;right:-30px;top:-30px;width:90px;height:90px;border-radius:50%;
    background:radial-gradient(circle,var(--accent-glow),transparent 70%);
  }
  .promo strong{font-family:var(--display);display:block;font-size:14px;margin-bottom:4px;}
  .promo p{margin:0 0 12px;font-size:11.5px;color:var(--ink-2);line-height:1.45;}
  .promo button{
    width:100%;height:36px;border:none;border-radius:9px;cursor:pointer;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#04201C;
    font-family:inherit;font-size:11.5px;font-weight:800;letter-spacing:.05em;
  }
  .rail-toggle{
    margin-top:14px;display:flex;align-items:center;justify-content:center;gap:0;
    height:40px;border:1px solid var(--line);background:var(--panel);border-radius:11px;
    color:var(--ink-2);cursor:pointer;font-family:inherit;font-size:11.5px;font-weight:700;
    letter-spacing:.04em;transition:.16s;flex:none;white-space:nowrap;
  }
  .sidebar.open .rail-toggle{gap:10px;}
  .rail-toggle:hover{color:var(--accent);border-color:var(--accent);}
  .rail-toggle svg{flex:none;transition:transform .3s cubic-bezier(.2,.8,.2,1);}

  /* ── content ── */
  .content{flex:1;padding:34px 40px 56px;overflow-y:auto;}
  .page-head{margin-bottom:26px;}
  .page-head h1{
    font-family:var(--display);font-size:30px;font-weight:800;margin:0 0 6px;letter-spacing:-.01em;
  }
  .page-head h1 em{font-style:normal;color:var(--accent);}
  .page-head p{margin:0;font-size:13.5px;color:var(--muted);font-weight:500;}

  .tabs{display:flex;align-items:center;gap:8px;margin-bottom:30px;}
  .tab{
    display:flex;align-items:center;gap:9px;padding:11px 18px;
    background:var(--panel);border:1px solid var(--line);border-radius:99px;
    font-family:inherit;font-size:12.5px;font-weight:700;letter-spacing:.02em;color:var(--ink-2);
    cursor:pointer;transition:.16s;white-space:nowrap;
  }
  .tab svg{color:var(--muted);transition:.16s;}
  .tab:hover{color:var(--ink);border-color:#33404F;}
  .tab.active{
    background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#04201C;border-color:transparent;
    box-shadow:0 8px 22px -10px var(--accent-glow);
  }
  .tab.active svg{color:#04201C;}
  .der-btn{
    display:inline-flex;align-items:center;justify-content:center;padding:11px 20px;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#04201C;
    border:none;border-radius:99px;font-family:var(--display);font-size:12.5px;font-weight:800;
    letter-spacing:.02em;cursor:pointer;transition:.16s;white-space:nowrap;
    box-shadow:0 8px 22px -10px var(--accent-glow);
  }
  .der-btn:hover{filter:brightness(1.07);transform:translateY(-1px);}

  /* ── grid + cards ── */
  .grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px;}
  @media (max-width:1320px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));}}
  @media (max-width:1000px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));}}
  @media (max-width:920px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));}}
  @media (max-width:640px){.grid{grid-template-columns:1fr;}.content{padding:26px 20px 44px;}}

  .card{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;
    display:flex;flex-direction:column;transition:transform .25s cubic-bezier(.2,.8,.2,1),border-color .25s,box-shadow .25s;
    opacity:0;transform:translateY(16px);animation:rise .55s cubic-bezier(.2,.8,.2,1) forwards;
  }
  @keyframes rise{to{opacity:1;transform:none;}}
  .card:hover{transform:translateY(-6px);border-color:#36424F;box-shadow:0 26px 50px -28px rgba(0,0,0,.85);}

  .cover{position:relative;height:142px;display:flex;align-items:center;justify-content:center;overflow:hidden;}
  .cover::before{
    content:"";position:absolute;inset:0;
    background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.06) 0 2px,transparent 2px 14px);
  }
  .cover::after{
    content:"";position:absolute;inset:0;
    background:linear-gradient(180deg,rgba(0,0,0,.05) 40%,rgba(0,0,0,.45));
  }
  .cover-glyph{
    position:absolute;right:-10px;bottom:-32px;font-family:var(--display);font-size:120px;line-height:1;font-weight:800;
    color:rgba(255,255,255,.14);z-index:1;
  }
  .cover-title{
    position:relative;z-index:2;color:#fff;font-family:var(--display);font-weight:800;
    font-size:30px;letter-spacing:.01em;text-transform:uppercase;
    text-shadow:0 3px 14px rgba(0,0,0,.35);text-align:center;padding:0 14px;
  }
  .cover-cat{
    position:absolute;left:14px;top:14px;z-index:3;font-size:10px;font-weight:800;letter-spacing:.06em;
    text-transform:uppercase;color:#fff;background:rgba(0,0,0,.3);padding:5px 11px;border-radius:99px;
    backdrop-filter:blur(3px);border:1px solid rgba(255,255,255,.18);
  }
  .cover-rating{
    position:absolute;right:14px;top:14px;z-index:3;font-size:11.5px;font-weight:800;color:#fff;
    background:rgba(0,0,0,.3);padding:5px 11px;border-radius:99px;display:flex;align-items:center;gap:5px;
    backdrop-filter:blur(3px);border:1px solid rgba(255,255,255,.18);
  }
  .cover-rating .star{color:#FFCC4D;}
  .badge-done{
    position:absolute;left:14px;bottom:14px;z-index:3;display:flex;align-items:center;gap:5px;
    font-size:10.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:#04201C;
    background:var(--accent);padding:5px 10px;border-radius:99px;
  }

  .body{padding:20px;display:flex;flex-direction:column;flex:1;}
  .desc{font-family:var(--display);font-size:16px;font-weight:700;color:var(--ink);line-height:1.3;margin:0 0 12px;min-height:42px;}
  .meta{
    display:flex;align-items:center;gap:8px;flex-wrap:wrap;
    font-size:11.5px;color:var(--muted);font-weight:600;margin:0 0 18px;
  }
  .meta span{display:flex;align-items:center;gap:5px;white-space:nowrap;}
  .meta .dot{width:3px;height:3px;border-radius:50%;background:#3A4555;}
  .perf{display:flex;align-items:baseline;justify-content:space-between;font-size:11.5px;font-weight:700;color:var(--ink-2);margin-bottom:9px;}
  .perf b{font-family:var(--display);font-size:15px;color:var(--accent);}
  .perf.zero b{color:var(--muted);}
  .track{height:7px;background:var(--track);border:1px solid var(--line-soft);border-radius:99px;overflow:hidden;margin-bottom:20px;}
  .fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent-2));width:0;transition:width 1s cubic-bezier(.2,.8,.2,1);}
  .btn{
    margin-top:auto;height:44px;border:none;border-radius:11px;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#04201C;
    font-family:inherit;font-size:12px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;
    cursor:pointer;transition:.16s;display:flex;align-items:center;justify-content:center;gap:8px;
  }
  .btn:hover{filter:brightness(1.08);box-shadow:0 10px 26px -12px var(--accent-glow);}
  .btn.done{background:transparent;color:var(--accent);border:1.5px solid var(--line);}
  .btn.done:hover{border-color:var(--accent);background:rgba(57,214,196,.07);box-shadow:none;}
</style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="#04201C"><path d="M6 4l14 8-14 8z"/></svg>
      </div>
      <div class="brand-txt">
        <small>PLATAFORMA DE</small>
        <strong>ESTUDOS</strong>
      </div>
    </div>
    <div class="top-right">
      <button class="theme-toggle" id="themeToggle" title="Alternar tema" aria-label="Alternar tema claro/escuro">
        <svg class="i-moon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="i-sun" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2.5M12 19.5V22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M2 12h2.5M19.5 12H22M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg>
      </button>
      <span class="top-link">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="4" width="19" height="13" rx="1.5"/><path d="M9 21h6M12 17v4"/></svg>
        CURSOS
      </span>
      <span class="top-avatar">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.6"/><path d="M5 20c0-3.6 3.1-5.4 7-5.4s7 1.8 7 5.4"/></svg>
      </span>
    </div>
  </header>

  <div class="shell">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-inner">
        <div class="user">
          <div class="user-av">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.6"/><path d="M5 20c0-3.6 3.1-5.4 7-5.4s7 1.8 7 5.4"/></svg>
          </div>
          <div class="user-meta reveal">
            <strong>Fred Lucena</strong>
            <span>Em andamento</span>
          </div>
        </div>
        <div class="nav-label reveal">NAVEGAÇÃO</div>
        <nav class="nav" id="nav"></nav>

        <div class="sidebar-foot">
          <div class="promo reveal">
            <strong>Plano Pro</strong>
            <p>Acesso ilimitado a trilhas, projetos e certificados.</p>
            <button>Conhecer</button>
          </div>
          <button class="rail-toggle" id="railToggle" aria-label="Expandir ou recolher o menu">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
            <span class="reveal">Recolher</span>
          </button>
        </div>
      </div>
    </aside>

    <main class="content">
      <div class="page-head">
        <h1>Continue de onde <em>parou</em></h1>
        <p>Você tem 6 cursos na sua jornada de aprendizado.</p>
      </div>

      <div class="tabs" id="tabs">
        <button class="tab active" data-tab="meus">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.4L3 21l1.1-3.6A8.5 8.5 0 1 1 21 11.5z"/></svg>
          Meus Cursos
        </button>
        <button class="tab" data-tab="lista">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
          Lista de Cursos
        </button>
        <button class="der-btn" id="derBtn">DER Fácil</button>
      </div>
      <div class="grid" id="grid"></div>
    </main>
  </div>

<script>
const COURSES = [
  { short:"REACT",      desc:"Formação Front-end Completa",      cat:"Frontend",      level:"Intermediário", lessons:48, duration:"32h", rating:4.9, progress:65,  glyph:"⚛", from:"#FF8A1E", to:"#F22730" },

function svg(path, size){
  return '<svg width="'+(size||18)+'" height="'+(size||18)+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">'+path+'</svg>';
}

// nav
const navEl = document.getElementById('nav');
NAV.forEach(function(n){
  const b = document.createElement('button');
  b.className = 'nav-item' + (n.id==='meus' ? ' active' : '');
  b.innerHTML = svg(n.icon) + '<span class="reveal">'+n.label+'</span>';
  b.onclick = function(){
    if(n.id==='sair') return;
    document.querySelectorAll('.nav-item').forEach(function(x){x.classList.remove('active');});
    b.classList.add('active');
  };
  navEl.appendChild(b);
});

// cards
function btnLabel(p){ return p===0 ? 'Começar curso' : p===100 ? 'Rever curso' : 'Continuar curso'; }
const playIcon = '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M6 4l14 8-14 8z"/></svg>';
const replayIcon = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 4v4h4"/></svg>';

const grid = document.getElementById('grid');
COURSES.forEach(function(c, i){
  const done = c.progress===100;
  const card = document.createElement('article');
  card.className = 'card';
  card.style.animationDelay = (i*0.07)+'s';
  card.innerHTML =
    '<div class="cover" style="background:linear-gradient(140deg,'+c.from+','+c.to+')">' +
      '<span class="cover-cat">'+c.cat+'</span>' +
      '<span class="cover-rating"><span class="star">★</span>'+c.rating.toFixed(1)+'</span>' +
      '<span class="cover-glyph">'+c.glyph+'</span>' +
      '<span class="cover-title">'+c.short+'</span>' +
      (done ? '<span class="badge-done">✓ Concluído</span>' : '') +
    '</div>' +
    '<div class="body">' +
      '<p class="desc">'+c.desc+'</p>' +
      '<div class="meta">' +
        '<span>'+c.lessons+' aulas</span><span class="dot"></span>' +
        '<span>'+c.duration+'</span><span class="dot"></span>' +
        '<span>'+c.level+'</span>' +
      '</div>' +
      '<div class="perf'+(c.progress===0?' zero':'')+'"><span>Progresso</span><b>'+c.progress+'%</b></div>' +
      '<div class="track"><div class="fill" data-p="'+c.progress+'"></div></div>' +
      '<button class="btn'+(done?' done':'')+'">'+(done?replayIcon:playIcon)+btnLabel(c.progress)+'</button>' +
    '</div>';
  grid.appendChild(card);
});

// animate progress bars in after load
requestAnimationFrame(function(){
  setTimeout(function(){
    document.querySelectorAll('.fill').forEach(function(f){ f.style.width = f.dataset.p + '%'; });
  }, 250);
});

// tabs
document.querySelectorAll('.tab').forEach(function(t){
  t.onclick = function(){
    document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('active');});
    t.classList.add('active');
  };
});

// theme toggle (dark <-> light) + persistência
(function(){
  var KEY = 'plataforma-tema';
  // restaura a última seleção ao carregar
  try{
    if(localStorage.getItem(KEY) === 'light'){
      document.body.classList.add('light');
    }
  }catch(e){ /* armazenamento indisponível */ }

  document.getElementById('themeToggle').onclick = function(){
    var isLight = document.body.classList.toggle('light');
    try{
      localStorage.setItem(KEY, isLight ? 'light' : 'dark');
    }catch(e){ /* ignora se bloqueado */ }
  };
})();

// sidebar: trilha de ícones que expande no hover (desktop) e no toque (mobile)
(function(){
  var sidebar = document.getElementById('sidebar');
  var railToggle = document.getElementById('railToggle');
  var hoverCapable = window.matchMedia('(hover:hover) and (pointer:fine)').matches;

  function open(){ sidebar.classList.add('open'); }
  function close(){ sidebar.classList.remove('open'); }

  // desktop: expande ao encostar, recolhe ao sair
  if(hoverCapable){
    sidebar.addEventListener('mouseenter', open);
    sidebar.addEventListener('mouseleave', close);
  }

  // botão recolher/expandir (funciona em qualquer dispositivo)
  railToggle.addEventListener('click', function(e){
    e.stopPropagation();
    sidebar.classList.toggle('open');
  });

  // mobile: tocar na trilha recolhida (borda esquerda) expande
  sidebar.addEventListener('click', function(){
    if(!hoverCapable && !sidebar.classList.contains('open')){
      open();
    }
  });

  // tocar fora recolhe novamente
  document.addEventListener('click', function(e){
    if(!sidebar.contains(e.target)){
      close();
    }
  });
})();
</script>
