<style>
  :root{
    --bg:#f5f1e6;
    --bg-dot:rgba(32,38,47,0.12);
    --surface:#fffdf8;
    --surface-2:#ede5d1;
    --ink:#20262f;
    --ink-soft:#6b6455;
    --border:#d9cfb4;
    --border-soft:#e8e0cb;
    --entity-ink:#1f3a63;
    --entity-fill:#e3ebf8;
    --relationship-ink:#93401f;
    --relationship-fill:#f8e7db;
    --attribute-ink:#2e5b41;
    --attribute-fill:#e2f0e5;
    --accent-ink:#8a5a12;
    --accent-fill:#f5e4bd;
    --note-ink:#5b4a8f;
    --note-fill:#efeaf9;
    --select:#2b6cb0;
    --danger:#a23b3b;
    --danger-fill:#f6e0df;
    --shadow:0 1px 2px rgba(32,26,10,.08), 0 10px 24px -12px rgba(32,26,10,.28);
    --font-display:'Fraunces', Georgia, 'Times New Roman', serif;
    --font-body:'Public Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --font-mono:'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#171a1f;
      --bg-dot:rgba(230,224,208,0.10);
      --surface:#1e232a;
      --surface-2:#262c34;
      --ink:#eae5d8;
      --ink-soft:#a49c88;
      --border:#3a4049;
      --border-soft:#2c323b;
      --entity-ink:#93b7ec;
      --entity-fill:#233350;
      --relationship-ink:#e6a077;
      --relationship-fill:#3c2a20;
      --attribute-ink:#8fd1a9;
      --attribute-fill:#1f3226;
      --accent-ink:#e3ba66;
      --accent-fill:#3d3013;
      --note-ink:#b7a8ea;
      --note-fill:#2b2740;
      --select:#6fa8dc;
      --danger:#e2908f;
      --danger-fill:#3a2323;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 28px -12px rgba(0,0,0,.6);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#171a1f;
    --bg-dot:rgba(230,224,208,0.10);
    --surface:#1e232a;
    --surface-2:#262c34;
    --ink:#eae5d8;
    --ink-soft:#a49c88;
    --border:#3a4049;
    --border-soft:#2c323b;
    --entity-ink:#93b7ec;
    --entity-fill:#233350;
    --relationship-ink:#e6a077;
    --relationship-fill:#3c2a20;
    --attribute-ink:#8fd1a9;
    --attribute-fill:#1f3226;
    --accent-ink:#e3ba66;
    --accent-fill:#3d3013;
    --note-ink:#b7a8ea;
    --note-fill:#2b2740;
    --select:#6fa8dc;
    --danger:#e2908f;
    --danger-fill:#3a2323;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 28px -12px rgba(0,0,0,.6);
    color-scheme: dark;
  }

  *{box-sizing:border-box;}
  /* Garante que o atributo "hidden" sempre esconda o elemento, mesmo quando alguma outra regra
     (como o "display:flex" de #toolbarConceptual/#toolbarLogical logo abaixo) também mira nesse
     mesmo elemento — sem isso, uma regra de autor com "display" definido vence o estilo padrão
     do navegador para [hidden], e o elemento continua aparecendo mesmo marcado como oculto. */
  [hidden]{ display:none !important; }
  body{
    margin:0; height:100vh; overflow:hidden;
    background:var(--bg); color:var(--ink);
    font-family:var(--font-body); font-size:14.5px;
    display:flex; flex-direction:column;
  }
  button, input, select{ font-family:inherit; font-size:inherit; color:inherit; }
  button{ cursor:pointer; }

  header{
    display:flex; align-items:center; gap:10px; row-gap:8px; flex-wrap:wrap;
    padding:10px 18px; background:var(--surface);
    border-bottom:1px solid var(--border); flex-shrink:0;
  }
  .brand{ display:flex; align-items:baseline; gap:8px; margin-right:6px; }
  .brand .mark{
    font-family:var(--font-display); font-weight:700; font-size:19px; letter-spacing:.2px;
    cursor:pointer;
  }
  .brand .tag{ font-size:11.5px; color:var(--ink-soft); }
  .mode-select{
    font-size:11.5px; color:var(--ink-soft); background:transparent;
    border:1px solid transparent; border-radius:5px; padding:3px 4px; cursor:pointer;
  }
  .mode-select:hover{ border-color:var(--border); background:var(--surface-2); }
  .mode-select:focus{ outline:none; border-color:var(--select); }
  header input#projectName{
    background:transparent; border:1px solid transparent; border-radius:6px;
    padding:5px 8px; font-family:var(--font-display); font-weight:600; font-size:15px;
    color:var(--ink); min-width:180px; max-width:320px;
  }
  header input#projectName:hover{ border-color:var(--border); }
  header input#projectName:focus{ outline:none; border-color:var(--select); background:var(--surface-2); }
  .spacer{ flex:1; min-width:8px; }
  .autosave-note{ font-size:11.5px; color:var(--ink-soft); font-family:var(--font-mono); white-space:nowrap; }
  .hbtn{
    display:inline-flex; align-items:center; gap:6px;
    background:var(--surface-2); border:1px solid var(--border); border-radius:7px;
    padding:7px 11px; font-size:13px; font-weight:500; color:var(--ink);
  }
  .hbtn:hover{ background:var(--border-soft); }
  .hbtn svg{ width:15px; height:15px; flex-shrink:0; }

  main{ flex:1; display:flex; min-height:0; }

  aside.toolbar{
    width:190px; flex-shrink:0; background:var(--surface);
    border-right:1px solid var(--border); overflow-y:auto;
    padding:14px 12px 24px; display:flex; flex-direction:column; gap:16px;
  }
  .tgroup-label{
    font-size:10.5px; font-weight:600; letter-spacing:.08em; text-transform:uppercase;
    color:var(--ink-soft); padding:0 2px;
  }
  .tgroup{ display:flex; flex-direction:column; gap:5px; }
  #toolbarConceptual, #toolbarLogical{ display:flex; flex-direction:column; gap:16px; }
  .tbtn{
    display:flex; align-items:center; gap:9px; text-align:left;
    background:transparent; border:1px solid transparent; border-radius:7px;
    padding:7px 8px; font-size:13px; color:var(--ink); width:100%;
  }
  .tbtn:hover{ background:var(--surface-2); }
  .tbtn.active{ background:var(--accent-fill); border-color:var(--accent-ink); color:var(--accent-ink); }
  .tbtn svg{ width:20px; height:20px; flex-shrink:0; }
  .tbtn .ic-stroke{ stroke:var(--ink-soft); fill:none; }
  .tbtn.active .ic-stroke{ stroke:var(--accent-ink); }
  hr.tdiv{ border:none; border-top:1px solid var(--border-soft); margin:2px 0; }
  .grid-size-ctl{ padding:4px 8px 2px; }
  .grid-size-ctl label{
    display:block; font-size:11px; color:var(--ink-soft); margin-bottom:5px;
  }
  .grid-size-row{ display:flex; align-items:center; gap:5px; }
  .grid-size-row button{
    width:24px; height:24px; flex-shrink:0; border-radius:6px; border:1px solid var(--border);
    background:var(--surface-2); color:var(--ink); font-size:14px; line-height:1; padding:0;
  }
  .grid-size-row button:hover{ background:var(--border-soft); }
  .grid-size-row input{
    width:100%; min-width:0; text-align:center; border:1px solid var(--border); border-radius:6px;
    background:var(--surface); color:var(--ink); padding:4px 2px; font-family:var(--font-mono); font-size:12.5px;
  }
  .grid-size-row input:focus{ outline:none; border-color:var(--select); }
  /* remove as setinhas nativas do input number para um visual mais limpo, junto dos botões +/- */
  .grid-size-row input::-webkit-outer-spin-button,
  .grid-size-row input::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
  .grid-size-row input[type=number]{ -moz-appearance:textfield; }

  .canvas-wrap{ position:relative; flex:1; overflow:hidden; background:var(--bg); }
  svg#stage{ width:100%; height:100%; display:block; user-select:none; -webkit-user-select:none; cursor:grab; }
  svg#stage:active{ cursor:grabbing; }
  svg#stage.mode-connect{ cursor:crosshair; }
  svg#stage.mode-place{ cursor:copy; }
  .node-g{ cursor:grab; }
  .node-g:active{ cursor:grabbing; }
  .shape-entity{ fill:var(--entity-fill); stroke:var(--entity-ink); stroke-width:1.6; }
  .shape-entity-inner{ fill:none; stroke:var(--entity-ink); stroke-width:1.4; }
  .shape-relationship{ fill:var(--relationship-fill); stroke:var(--relationship-ink); stroke-width:1.6; }
  .shape-relationship-inner{ fill:none; stroke:var(--relationship-ink); stroke-width:1.4; }
  .shape-attribute{ fill:var(--attribute-fill); stroke:var(--attribute-ink); stroke-width:1.5; }
  .shape-attribute-inner{ fill:none; stroke:var(--attribute-ink); stroke-width:1.3; }
  .shape-attribute.derived{ stroke-dasharray:4 3; }
  .attr-hit{ fill:transparent; }
  .shape-gen{ fill:var(--accent-fill); stroke:var(--accent-ink); stroke-width:1.6; }
  .shape-note{ fill:var(--note-fill); stroke:var(--note-ink); stroke-width:1.4; stroke-dasharray:3 2; }
  .shape-table{ fill:var(--surface); stroke:var(--entity-ink); stroke-width:1.6; }
  .table-header-text{
    font-family:var(--font-display); font-weight:600; font-size:13px; fill:var(--entity-ink);
    text-anchor:middle; dominant-baseline:central; pointer-events:none; user-select:none;
  }
  .table-divider{ stroke:var(--entity-ink); stroke-width:1.2; opacity:.5; }
  .table-row-text{
    font-family:var(--font-mono); font-size:11px; fill:var(--ink);
    dominant-baseline:central; pointer-events:none; user-select:none;
  }
  .table-row-text.pk{ font-weight:700; fill:var(--entity-ink); text-decoration:underline; }
  .table-row-text.fk{ font-style:italic; fill:var(--accent-ink); }
  .note-text{
    font-family:var(--font-body); fill:var(--note-ink);
    pointer-events:none; user-select:none; white-space:pre;
  }
  .note-resize-handle{ fill:var(--surface); stroke:var(--note-ink); stroke-width:1.4; cursor:nwse-resize; }
  .node-label{
    font-family:var(--font-body); font-size:12.5px; font-weight:500; fill:var(--ink);
    text-anchor:middle; dominant-baseline:central; pointer-events:none; user-select:none;
  }
  .node-label.key{ text-decoration:underline; }
  .node-label.left-align{ text-anchor:start; }

<script>
  // Tela de abertura: fundo preto com o logo girando lentamente, exibida por 2 segundos antes de
  // liberar o app. Roda num <script> próprio, separado do script principal do app (que só é
  // interpretado depois, mais abaixo no arquivo) para começar a contar o tempo assim que a página
  // carrega, sem depender da inicialização do resto do app.
  (function(){
    var el = document.getElementById("splashOverlay");
    if (!el) return;
    setTimeout(function(){
      el.classList.add("splash-hide");
      setTimeout(function(){ if (el.parentNode) el.parentNode.removeChild(el); }, 550);
    }, 2000);
  })();
</script>

<header>

      <option value="logical">Modelagem Lógica</option>

  </div>
  <input id="projectName" type="text" value="" spellcheck="false">
  <span class="autosave-note" id="autosaveNote"></span>
  <div class="spacer"></div>

  <button class="hbtn" id="btnLegend" title="Guia de notação">

</header>

<script>
(function(){
"use strict";

/* ---------- estado ---------- */
var STORAGE_KEY = "estudioDER.autosave.v1";     // formato antigo: só o modelo conceitual (compatibilidade)
var STORAGE_KEY_V2 = "estudioDER.autosave.v2";  // formato novo: os dois modelos (conceitual + lógico) e o modo ativo
var PREFS_KEY = "estudioDER.prefs.v1";  // preferências de edição (grade), independentes do projeto salvo
var TYPES_KEY = "estudioDER.types.v1";  // lista de tipos de dados disponíveis nas colunas do modelo lógico — cadastrada pelo usuário, independente do projeto salvo (vale em qualquer diagrama aberto neste navegador)
var THEME_KEY = "estudioDER.theme.v1";  // preferência de tema (claro/escuro) escolhida no botão, independente do projeto salvo
var SVG_NS = "http://www.w3.org/2000/svg";

// Tipos de dados que já vêm cadastrados por padrão — o usuário pode adicionar outros ou excluir
// estes pelo painel "Gerenciar tipos" (no modo lógico). O "tamanho" (ex.: o "50" de VARCHAR(50))
// é digitado à parte, num campo próprio ao lado do tipo, e concatenado entre parênteses só na
// hora de exibir/gerar o tipo completo da coluna (ver fullDataType).
var DEFAULT_DATA_TYPES = ["INT", "BIGINT", "SMALLINT", "TINYINT", "BIT", "DECIMAL", "FLOAT", "REAL", "CHAR", "VARCHAR", "NCHAR", "NVARCHAR", "DATE", "TIME"];
var customDataTypes = DEFAULT_DATA_TYPES.slice();
// Os tipos cadastrados são sempre mostrados em ordem alfabética (sem diferenciar maiúsc./minúsc.),
// tanto no painel "Gerenciar tipos" quanto nos combos de tipo das colunas — chamada sempre que a
// lista muda (cadastro inicial, adicionar, remover, carregar do localStorage).
function sortDataTypes(list){
  list.sort(function(a, b){ return a.toLowerCase().localeCompare(b.toLowerCase()); });
  return list;
}
sortDataTypes(customDataTypes);

// Um projeto agora guarda DOIS modelos independentes — "conceptual" (o DER em notação Chen) e
// "logical" (tabelas do modelo relacional) — e `mode` diz qual deles está ativo. `state` sempre
// aponta para o modelo ativo (o mesmo objeto guardado em conceptualModel/logicalModel), então
// quase todo o resto do código (render, seleção, arraste, painel...) continua igual, sem
// precisar saber se está lidando com entidades/relacionamentos ou com tabelas.
var mode = "conceptual";        // "conceptual" | "logical"
var conceptualModel = null;
var logicalModel = null;        // null até a primeira vez que o usuário entra em "Modelagem Lógica"
var state = null;
var view = { x:0, y:0, w:1200, h:800 };
var selectedNodeIds = new Set();
var selectedEdgeIds = new Set();
var connectMode = false;
var connectFrom = null;
// "Fixado" (Ctrl/Cmd+clique no botão Conectar, ver mais abaixo): quando true, o modo conectar
// continua ativo depois de completar uma conexão, para fazer várias em seguida. Sem Ctrl, o botão
// só fica pressionado durante UMA conexão -- assim que ela é concluída, desliga sozinho.
var connectSticky = false;
// Desfazer/Refazer (Ctrl+Z / Ctrl+Y): pilha de snapshots (string JSON) do estado completo
// {mode, conceptual, logical}. Cada redrawStage() (o ponto único por onde passam praticamente
// todas as mutações de dados do app) compara o snapshot atual com o último salvo; se mudou,
// agenda um "checkpoint" com um pequeno debounce para que interações contínuas (digitar,
// arrastar) virem UM único passo de desfazer, em vez de um por tecla/frame.
var undoStack = [];
var redoStack = [];
var UNDO_LIMIT = 100;
var UNDO_COALESCE_MS = 600;
var undoDebounceTimer = null;
var undoPendingBefore = null;    // snapshot de ANTES da mudança em andamento (para o passo pendente)
var undoLastSnapshot = null;     // último snapshot conhecido (usado para detectar se algo mudou)
var undoSuppressed = false;      // true durante applySnapshotString(), para não gerar checkpoint da própria restauração
var pendingAdd = null;           // {type, weak, identifying, kind}
var spaceHeld = false;
var GRID_SIZE_MIN = 10, GRID_SIZE_MAX = 100;
var GRID_SIZE = 26;              // espaçamento (em px do SVG) dos pontos do fundo e do encaixe ao arrastar
var snapToGrid = true;
function snapValue(v){ return Math.round(v / GRID_SIZE) * GRID_SIZE; }

var stageEl = document.getElementById("stage");
var edgesGroup = document.getElementById("edgesGroup");
var nodesGroup = document.getElementById("nodesGroup");
var marqueeEl = document.getElementById("marqueeRect");
var panelEl = document.getElementById("panel");
var toastWrap = document.getElementById("toastWrap");
var projectNameInput = document.getElementById("projectName");
var autosaveNote = document.getElementById("autosaveNote");
var dotgridEl = document.getElementById("dotgrid");
var gridSizeInput = document.getElementById("gridSizeInput");

function setGridSize(v, skipSave){
  v = Math.round(Number(v));
  if (!isFinite(v)) v = GRID_SIZE;
  v = clamp(v, GRID_SIZE_MIN, GRID_SIZE_MAX);
  GRID_SIZE = v;
  dotgridEl.setAttribute("width", v);
  dotgridEl.setAttribute("height", v);
  gridSizeInput.value = v;
  if (!skipSave) savePrefs();
}

// Preferências de grade (espaçamento e se o encaixe está ativado) — salvas à parte do projeto,
// para valerem em qualquer diagrama aberto depois, inclusive num navegador sem nada salvo ainda.
function savePrefs(){
  try {
    localStorage.setItem(PREFS_KEY, JSON.stringify({ gridSize: GRID_SIZE, snapToGrid: snapToGrid }));
  } catch (err){ /* localStorage indisponível: preferências não persistem, mas o app segue funcionando */ }
}
function loadPrefs(){
  try {
    var raw = localStorage.getItem(PREFS_KEY);
    if (!raw) return;
    var p = JSON.parse(raw);
    if (p && isFinite(Number(p.gridSize))) GRID_SIZE = clamp(Math.round(Number(p.gridSize)), GRID_SIZE_MIN, GRID_SIZE_MAX);
    if (p && typeof p.snapToGrid === "boolean") snapToGrid = p.snapToGrid;
  } catch (err){ /* ignora preferências corrompidas e usa os padrões */ }
}

// Lista de tipos de dados disponíveis nos combo box das colunas do modelo lógico — salva à parte
// do projeto (como a grade), então cadastrar/excluir um tipo vale em qualquer diagrama aberto
// neste navegador. Sem nada salvo ainda (primeira vez), usa a lista padrão.
function saveDataTypePrefs(){
  try {
    localStorage.setItem(TYPES_KEY, JSON.stringify(customDataTypes));
  } catch (err){ /* localStorage indisponível: a lista não persiste, mas o app segue funcionando */ }
}
function loadDataTypePrefs(){
  try {
    var raw = localStorage.getItem(TYPES_KEY);
    if (!raw) return;
    var arr = JSON.parse(raw);
    if (Array.isArray(arr) && arr.length){
      customDataTypes = arr.map(function(t){ return String(t); }).filter(function(t){ return t.trim() !== ""; });
      sortDataTypes(customDataTypes);
    }
  } catch (err){ /* ignora lista corrompida e usa os padrões */ }
}

// Tema (claro/escuro): o CSS já segue sozinho a preferência do sistema operacional (media query
// prefers-color-scheme). O atributo data-theme="light"/"dark" na raiz do documento tem prioridade
// sobre essa media query (ver regras no <style>), então usá-lo é o suficiente para o botão fixar
// uma escolha explícita, que fica salva neste navegador para as próximas visitas.
var isDarkTheme = false;
function computeInitialDarkTheme(){
  try {
    var saved = localStorage.getItem(THEME_KEY);
    if (saved === "dark") return true;
    if (saved === "light") return false;
  } catch (err){ /* localStorage indisponível: cai no padrão do sistema operacional */ }
  try {
    return !!(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
  } catch (err){ return false; }
}
function applyTheme(){
  document.documentElement.setAttribute("data-theme", isDarkTheme ? "dark" : "light");
  var btn = document.getElementById("btnTheme");
  if (!btn) return;
  btn.innerHTML = isDarkTheme
    ? '<svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="4.3" fill="none" stroke="currentColor" stroke-width="1.5"/><g stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><line x1="10" y1="1.3" x2="10" y2="3.3"/><line x1="10" y1="16.7" x2="10" y2="18.7"/><line x1="1.3" y1="10" x2="3.3" y2="10"/><line x1="16.7" y1="10" x2="18.7" y2="10"/><line x1="4.1" y1="4.1" x2="5.5" y2="5.5"/><line x1="14.5" y1="14.5" x2="15.9" y2="15.9"/><line x1="4.1" y1="15.9" x2="5.5" y2="14.5"/><line x1="14.5" y1="5.5" x2="15.9" y2="4.1"/></g></svg>Modo claro'
    : '<svg viewBox="0 0 20 20"><path fill="none" stroke="currentColor" stroke-width="1.5" d="M16.5 12.4A7 7 0 0 1 7.6 3.5a7 7 0 1 0 8.9 8.9Z"/></svg>Modo escuro';
  btn.title = isDarkTheme ? "Mudar para o modo claro" : "Mudar para o modo escuro";
}
function saveThemePref(){
  try { localStorage.setItem(THEME_KEY, isDarkTheme ? "dark" : "light"); }
  catch (err){ /* localStorage indisponível: a escolha não persiste, mas o app segue funcionando */ }
}

// Adiciona um tipo novo (aparado, sem duplicar ignorando maiúsc./minúsc.). Retorna false sem
// alterar nada quando o nome é vazio ou já existe.
function addDataType(name){
  var trimmed = String(name || "").trim();
  if (!trimmed) return false;
  var exists = customDataTypes.some(function(t){ return t.toLowerCase() === trimmed.toLowerCase(); });
  if (exists) return false;
  customDataTypes.push(trimmed);
  sortDataTypes(customDataTypes);
  saveDataTypePrefs();
  return true;
}
// Remove um tipo da lista de cadastrados. Não mexe nas colunas que já usam esse tipo — elas
// continuam mostrando o valor (como uma opção "extra" no combo, ver renderTablePanel) até o
// usuário trocar manualmente.
function removeDataType(name){
  customDataTypes = customDataTypes.filter(function(t){ return t !== name; });
  saveDataTypePrefs();
}

var DIMS = {
  entity:       { minW:120, h:52, pad:34 },
  relationship: { minW:118, h:74, pad:50 },
  attribute:    { minW:96,  h:42, pad:28 },
  attributeBare:{ minW:16,  h:22, pad:10 },  // atributo simples: só o texto, sem elipse ao redor
  generalization: { minW:46, h:34, pad:0 }
};

// Anotação: nota livre de largura fixa e altura ajustada ao texto (com quebra de linha automática) —
// não faz parte da notação Entidade-Relacionamento, é só um espaço para comentários no diagrama.
var NOTE_W = 220, NOTE_PAD = 12, NOTE_LINE_H = 17, NOTE_MIN_H = 46;
var NOTE_MIN_W = 80, NOTE_MAX_W = 900, NOTE_MAX_H = 900;
var NOTE_FONT_MIN = 8, NOTE_FONT_MAX = 48;

// Tabela do modelo lógico: caixa com um cabeçalho (nome da tabela) e uma linha por coluna
// ("nome : tipo", com marcadores [PK]/[FK]). Largura e altura se ajustam ao conteúdo.
var TABLE_HEADER_H = 30, TABLE_ROW_H = 19, TABLE_PAD_X = 12, TABLE_MIN_W = 140;

/* ---------- utilidades ---------- */
function uid(prefix){ return prefix + "_" + Math.random().toString(36).slice(2,9); }

function svgEl(tag, attrs){
  var el = document.createElementNS(SVG_NS, tag);
  if (attrs){ for (var k in attrs){ el.setAttribute(k, attrs[k]); } }
  return el;
}

var measureCtx = document.createElement("canvas").getContext("2d");
function measureTextWidth(text){
  measureCtx.font = "500 12.5px 'Public Sans', sans-serif";
  return measureCtx.measureText(text || "").width;
}
function measureNoteTextWidth(text, fontStr){
  measureCtx.font = fontStr;
  return measureCtx.measureText(text || "").width;
}
// Anotações agora têm formatação "rica": cada anotação guarda node.runs — uma lista de
// parágrafos, cada parágrafo uma lista de "trechos" (runs) { text, bold, italic, underline,
// fontSize } — o que permite negrito/itálico/sublinhado/tamanho diferentes dentro da MESMA
// caixa, aplicados ao texto que o usuário seleciona (em vez de formatar a caixa toda de uma vez).
function fontStringForRunStyle(style){
  var weight = (style && style.bold) ? "700" : "400";
  var italic = (style && style.italic) ? "italic " : "";
  var size = (style && style.fontSize) || 12;
  return italic + weight + " " + size + "px 'Public Sans', sans-serif";
}
function pieceWidth(piece){ return measureNoteTextWidth(piece.text, fontStringForRunStyle(piece.style)); }
function runsToPlainText(paragraphs){
  return (paragraphs || []).map(function(runs){
    return (runs || []).map(function(r){ return r.text; }).join("");
  }).join("\n");
}
function appendSpacePiece(pieces, style){
  var last = pieces[pieces.length - 1];
  if (last && last.style.bold === style.bold && last.style.italic === style.italic &&
      last.style.underline === style.underline && last.style.fontSize === style.fontSize){
    last.text += " ";
  } else {
    pieces.push({ text:" ", style:style });
  }
}
function makeEmptyLine(){
  return { pieces:[{ text:"", style:{ bold:false, italic:false, underline:false, fontSize:12 } }], lastOfPara:true, width:0, maxFontSize:12, naturalText:"" };
}
function finalizeLine(pieces, lastOfPara){
  var merged = [];
  pieces.forEach(function(p){
    var last = merged[merged.length - 1];
    if (last && last.style.bold === p.style.bold && last.style.italic === p.style.italic &&
        last.style.underline === p.style.underline && last.style.fontSize === p.style.fontSize){
      last.text += p.text;
    } else {
      merged.push({ text:p.text, style:p.style });
    }
  });
  if (!merged.length) merged.push({ text:"", style:{ bold:false, italic:false, underline:false, fontSize:12 } });
  var width = 0, maxFontSize = 12, naturalText = "";
  merged.forEach(function(p){ width += pieceWidth(p); maxFontSize = Math.max(maxFontSize, p.style.fontSize || 12); naturalText += p.text; });
  return { pieces:merged, lastOfPara:lastOfPara, width:width, maxFontSize:maxFontSize, naturalText:naturalText };
}
// Quebra os parágrafos (com formatação por trecho) em linhas que cabem em maxWidth. As palavras
// nunca são quebradas no meio, mesmo quando a formatação muda dentro de uma palavra (ex.: metade
// em negrito). Cada linha guarda "lastOfPara" (última linha do parágrafo) — no alinhamento
// justificado essa linha final fica à esquerda normalmente, como é costume.
function wrapNoteRuns(paragraphs, maxWidth){
  var lines = [];
  var paras = (paragraphs && paragraphs.length) ? paragraphs : [[]];
  paras.forEach(function(runs){
    var wordTokens = [];
    (runs || []).forEach(function(r){
      var style = { bold:!!r.bold, italic:!!r.italic, underline:!!r.underline, fontSize:r.fontSize || 12 };
      var parts = String(r.text || "").split(/(\s+)/);
      parts.forEach(function(p){
        if (p === "") return;
        if (/^\s+$/.test(p)){ wordTokens.push({ isSpace:true }); return; }
        var last = wordTokens[wordTokens.length - 1];
        if (last && !last.isSpace){ last.pieces.push({ text:p, style:style }); }
        else { wordTokens.push({ isSpace:false, pieces:[{ text:p, style:style }] }); }
      });
    });
    var words = wordTokens.filter(function(t){ return !t.isSpace; });
    if (words.length === 0){ lines.push(makeEmptyLine()); return; }
    var curPieces = [], curWidth = 0;
    words.forEach(function(word){
      var wWidth = 0;
      word.pieces.forEach(function(p){ wWidth += pieceWidth(p); });
      var spaceStyle = word.pieces[0].style;
      var spaceW = curPieces.length ? measureNoteTextWidth(" ", fontStringForRunStyle(spaceStyle)) : 0;
      var testWidth = curWidth + spaceW + wWidth;
      if (curPieces.length && testWidth > maxWidth){
        lines.push(finalizeLine(curPieces, false));
        curPieces = word.pieces.slice();
        curWidth = wWidth;
      } else {
        if (curPieces.length){ appendSpacePiece(curPieces, spaceStyle); curWidth += spaceW; }
        curPieces = curPieces.concat(word.pieces);
        curWidth += wWidth;
      }
    });
    lines.push(finalizeLine(curPieces, true));
  });
  if (lines.length === 0) lines.push(makeEmptyLine());
  return lines;
}

function clamp(v, lo, hi){ return Math.max(lo, Math.min(hi, v)); }

function showToast(msg, kind){
  var t = document.createElement("div");
  t.className = "toast" + (kind === "warn" ? " warn" : "");
  t.textContent = msg;
  toastWrap.appendChild(t);
  setTimeout(function(){
    t.style.transition = "opacity .25s ease";
    t.style.opacity = "0";
    setTimeout(function(){ t.remove(); }, 260);
  }, 3600);
}

function askConfirm(title, msg, okLabel, dangerous){
  return new Promise(function(resolve){
    var backdrop = document.createElement("div");
    backdrop.className = "modal-backdrop";
    backdrop.innerHTML =
      '<div class="modal-box">' +
        '<h2>' + escapeHtml(title) + '</h2>' +
        '<p>' + escapeHtml(msg) + '</p>' +
        '<div class="modal-actions">' +
          '<button data-a="cancel">Cancelar</button>' +
          '<button data-a="ok" class="primary' + (dangerous ? ' dangerous' : '') + '">' + escapeHtml(okLabel) + '</button>' +
        '</div>' +
      '</div>';
    document.body.appendChild(backdrop);
    backdrop.addEventListener("click", function(e){
      if (e.target === backdrop){ cleanup(false); }
    });
    backdrop.querySelector('[data-a="cancel"]').addEventListener("click", function(){ cleanup(false); });
    backdrop.querySelector('[data-a="ok"]').addEventListener("click", function(){ cleanup(true); });
    function cleanup(v){ backdrop.remove(); resolve(v); }
  });
}

// Igual a askConfirm, mas com três opções em vez de duas (ex.: Sim / Não / Limpar). `choices` é
// uma lista de { key, label, className, isDefault, isCancel } — isDefault leva o foco inicial
// (então Enter/Espaço já ativa aquele botão), isCancel é o que fecha o modal ao clicar fora dele.
// Resolve com a "key" escolhida.
function askChoice3(title, msg, choices){
  return new Promise(function(resolve){
    var backdrop = document.createElement("div");
    backdrop.className = "modal-backdrop";
    var buttonsHtml = choices.map(function(c){
      return '<button data-a="' + c.key + '" class="' + (c.className || "") + '">' + escapeHtml(c.label) + '</button>';
    }).join("");
    backdrop.innerHTML =
      '<div class="modal-box">' +
        '<h2>' + escapeHtml(title) + '</h2>' +
        '<p>' + escapeHtml(msg) + '</p>' +
        '<div class="modal-actions">' + buttonsHtml + '</div>' +
      '</div>';
    document.body.appendChild(backdrop);
    var cancelChoice = choices.filter(function(c){ return c.isCancel; })[0];
    backdrop.addEventListener("click", function(e){
      if (e.target === backdrop){ cleanup(cancelChoice ? cancelChoice.key : null); }
    });
    choices.forEach(function(c){
      backdrop.querySelector('[data-a="' + c.key + '"]').addEventListener("click", function(){ cleanup(c.key); });
    });
    var defaultChoice = choices.filter(function(c){ return c.isDefault; })[0];
    if (defaultChoice){
      var defBtn = backdrop.querySelector('[data-a="' + defaultChoice.key + '"]');
      if (defBtn) defBtn.focus();
    }
    function cleanup(v){ backdrop.remove(); resolve(v); }
  });
}

// Modal com um campo numérico (usado ao soltar o triângulo de Generalização sobre uma entidade —
// ver placeGeneralizationOnEntity). Resolve com o número escolhido (sempre um inteiro dentro de
// [minValue,maxValue]) ou com null se o usuário cancelar (clicando fora ou em "Cancelar").
function askNumberPrompt(title, msg, defaultValue, minValue, maxValue){
  return new Promise(function(resolve){
    var backdrop = document.createElement("div");
    backdrop.className = "modal-backdrop";
    backdrop.innerHTML =
      '<div class="modal-box">' +
        '<h2>' + escapeHtml(title) + '</h2>' +
        '<p>' + escapeHtml(msg) + '</p>' +
        '<div class="field"><label for="numPromptInput">Quantidade de entidades</label>' +
        '<input type="number" id="numPromptInput" min="' + minValue + '" max="' + maxValue + '" step="1" value="' + defaultValue + '"></div>' +
        '<div class="modal-actions">' +
          '<button data-a="cancel">Cancelar</button>' +
          '<button data-a="ok" class="primary">Criar</button>' +
        '</div>' +
      '</div>';
    document.body.appendChild(backdrop);
    var input = backdrop.querySelector("#numPromptInput");
    function submit(){
      var v = Math.round(Number(input.value));
      if (!isFinite(v)) v = defaultValue;
      v = clamp(v, minValue, maxValue);
      cleanup(v);
    }
    input.addEventListener("keydown", function(e){
      if (e.key === "Enter"){ e.preventDefault(); submit(); }
    });
    backdrop.addEventListener("click", function(e){ if (e.target === backdrop) cleanup(null); });
    backdrop.querySelector('[data-a="cancel"]').addEventListener("click", function(){ cleanup(null); });
    backdrop.querySelector('[data-a="ok"]').addEventListener("click", submit);
    function cleanup(v){ backdrop.remove(); resolve(v); }
    input.focus();
    input.select();
  });
}

function escapeHtml(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
    return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c];
  });
}

/* ---------- modelo de dados ---------- */
// attrAnchorV: 2 = a coordenada x de um atributo simples (sem elipse) é a borda ESQUERDA do
// texto. Estados sem essa marca (ou com valor diferente) vêm de antes dessa convenção — nesse
// caso a x salva era o CENTRO do texto, e normalizeLoadedState() faz a migração ao carregar.
function freshState(name){
  return {
    projectName: name || "Novo Modelo Conceitual",
    nodes: [],
    edges: [],
    nextIds: { entity:1, relationship:1, attribute:1, generalization:1, note:1 },
    attrAnchorV: 2
  };
}

// Modelo lógico: um projeto novo começa sem nenhum (logicalModel fica null) até o usuário
// selecionar "Modelagem Lógica" pela primeira vez, quando é gerado automaticamente a partir do
// modelo conceitual (ver convertConceptualToLogical). edges é sempre reconstruído a partir das
// colunas FK das tabelas (rebuildLogicalEdges), nunca editado diretamente.
function freshLogicalState(name){
  return {
    projectName: name || "Novo Modelo Conceitual",
    nodes: [],
    edges: [],
    nextIds: { table:1, note:1 }
  };
}

function addNodeAt(type, opts, x, y){
  var labels = { entity:"Entidade", relationship:"Relacionamento", attribute:"Atributo", generalization:"Generalização", note:"Anotação", table:"Tabela" };
  var n = Object.assign({
    id: uid("nd"),
    type: type,
    name: labels[type] + " " + (state.nextIds[type]++),
    x: x, y: y,
    weak: false, identifying: false,
    attrKind: "simple", isKey: false,
    coverage: "partial", overlap: "disjoint",
    noteW: null, noteH: null, align: "left",
    runs: [[]]
  }, opts || {});
  if (n.type === "note") n.text = runsToPlainText(n.runs);
  state.nodes.push(n);
  return n;
}

function getNode(id){
  for (var i=0;i<state.nodes.length;i++){ if (state.nodes[i].id === id) return state.nodes[i]; }
  return null;
}
function getEdge(id){
  for (var i=0;i<state.edges.length;i++){ if (state.edges[i].id === id) return state.edges[i]; }
  return null;
}

function connectionInfo(a, b){
  if (a.id === b.id) return { ok:false };
  if (a.type === "note" || b.type === "note") return { ok:false, reason:"Anotações são notas livres e não se conectam a outros elementos." };
  if (a.type === "table" || b.type === "table"){
    if (a.type !== "table" || b.type !== "table"){
      return { ok:false, reason:"Tabelas só se conectam a outras tabelas (chave estrangeira)." };
    }
    var hasPk = (b.columns || []).some(function(c){ return c.pk; });
    if (!hasPk){
      return { ok:false, reason:'A tabela "' + (b.name || "") + '" precisa ter uma coluna marcada como PK antes de receber uma referência (FK).' };
    }
    return { ok:true, kind:"fk" };
  }
  var ta = a.type, tb = b.type;
  var pair = [ta, tb].slice().sort().join("-");
  if (pair === "entity-relationship") return { ok:true, kind:"participation" };
  if (ta === "attribute" || tb === "attribute"){
    var other = ta === "attribute" ? tb : ta;
    if (other === "entity" || other === "relationship" || other === "attribute") return { ok:true, kind:"plain" };
    return { ok:false, reason:"Atributos só se conectam a entidades, relacionamentos ou outro atributo (composição)." };
  }
  if (pair === "entity-generalization") return { ok:true, kind:"plain" };
  // Duas entidades não se ligam diretamente na notação Entidade-Relacionamento — é sempre um
  // relacionamento que as associa. Em vez de recusar a conexão, "Conectar" cria esse
  // relacionamento automaticamente (ver handleNodeClick), já ligado às duas entidades.
  if (ta === "entity" && tb === "entity") return { ok:true, kind:"auto-relationship" };
  return { ok:false, reason:"Essa conexão não é válida na notação Entidade-Relacionamento." };
}

function deleteNode(id){
  var removedEdgeIds = state.edges.filter(function(e){ return e.from === id || e.to === id; }).map(function(e){ return e.id; });
  state.nodes = state.nodes.filter(function(n){ return n.id !== id; });
  state.edges = state.edges.filter(function(e){ return e.from !== id && e.to !== id; });
  selectedNodeIds.delete(id);
  removedEdgeIds.forEach(function(eid){ selectedEdgeIds.delete(eid); });
}
// No modelo lógico, uma "conexão" entre duas tabelas (edge.kind "fk") não é um dado próprio --
// é só um reflexo, recalculado a cada redesenho, das colunas marcadas como FK na tabela de
// origem apontando para a tabela de destino (ver rebuildLogicalEdges). Por isso, remover a
// conexão de state.edges sozinho não tem efeito nenhum: no próximo render() ela reaparece,
// recriada a partir das mesmas colunas. Excluir a conexão de verdade significa remover a(s)
// coluna(s) FK que a representam.
function fkColumnsForEdge(edge){
  var child = getNode(edge.from);
  if (!child) return [];
  return (child.columns || []).filter(function(c){ return c.fk && c.fkTable === edge.to; });
}
function removeLogicalFkColumns(edge){
  var child = getNode(edge.from);
  if (!child) return;
  child.columns = (child.columns || []).filter(function(c){ return !(c.fk && c.fkTable === edge.to); });
}
// Grava min/max de um dos lados (cardChild ou cardParent) em TODAS as colunas FK que formam essa
// conexão (uma FK composta, com mais de uma coluna, deve manter a mesma cardinalidade em todas).
function setFkCardinalityField(edge, side, field, value){
  fkColumnsForEdge(edge).forEach(function(c){
    c[side] = Object.assign({ min:"0", max:"N" }, c[side] || {});
    c[side][field] = value;
  });
}
function deleteEdge(id){
  if (mode === "logical"){
    var e = getEdge(id);
    if (e && e.kind === "fk") removeLogicalFkColumns(e);
  }
  state.edges = state.edges.filter(function(e){ return e.id !== id; });
  selectedEdgeIds.delete(id);
}
function deleteSelection(){
  if (selectedNodeIds.size === 0 && selectedEdgeIds.size === 0) return;
  Array.from(selectedNodeIds).forEach(deleteNode);
  Array.from(selectedEdgeIds).forEach(deleteEdge);
  selectedNodeIds.clear(); selectedEdgeIds.clear();
  render();
}

/* ---------- copiar / colar (Ctrl+C / Ctrl+V) ---------- */
// clipboard guarda um clone independente (JSON) dos nós selecionados no momento do Ctrl+C, mais
// as arestas cujas DUAS pontas estavam selecionadas (uma aresta com só uma ponta copiada não faz
// sentido colar sozinha). "mode" fica preso ao clipboard porque um nó de tabela (modelo lógico)
// não é válido no modelo conceitual e vice-versa.
var clipboard = null;
var pasteOffsetCount = 0;   // cresce a cada Ctrl+V seguido, para cada colagem aparecer um pouco deslocada da anterior

function copySelection(){
  if (selectedNodeIds.size === 0){ showToast("Selecione um ou mais elementos para copiar."); return; }
  var idSet = selectedNodeIds;
  var nodes = state.nodes.filter(function(n){ return idSet.has(n.id); }).map(function(n){ return JSON.parse(JSON.stringify(n)); });
  var edges = state.edges.filter(function(e){ return idSet.has(e.from) && idSet.has(e.to); }).map(function(e){ return JSON.parse(JSON.stringify(e)); });
  clipboard = { mode:mode, nodes:nodes, edges:edges };
  pasteOffsetCount = 0;
  showToast(nodes.length === 1 ? "1 elemento copiado." : nodes.length + " elementos copiados.");
}

function pasteClipboard(){
  if (!clipboard || !clipboard.nodes.length){ showToast("Nada para colar — copie algo primeiro com Ctrl+C."); return; }
  if (clipboard.mode !== mode){
    showToast("Isso foi copiado no outro modo de modelagem — mude para " + (clipboard.mode === "conceptual" ? "a modelagem conceitual" : "a modelagem lógica") + " para colar.", "warn");
    return;
  }
  pasteOffsetCount++;
  var offset = GRID_SIZE * pasteOffsetCount;
  var idMap = {};
  var newNodes = clipboard.nodes.map(function(n){
    var clone = JSON.parse(JSON.stringify(n));
    var newId = uid("nd");
    idMap[n.id] = newId;
    clone.id = newId;
    clone.x = n.x + offset;
    clone.y = n.y + offset;
    return clone;
  });
  // Uma coluna FK que apontava para uma tabela também copiada deve apontar para a NOVA cópia
  // dessa tabela (senão as duas cópias ficariam referenciando a tabela original, e não uma à
  // outra como no trecho copiado); uma FK para uma tabela de fora da seleção permanece apontando
  // para o original, que continua existindo.
  newNodes.forEach(function(n){
    if (n.type === "table" && n.columns){
      n.columns.forEach(function(c){
        if (c.fk && c.fkTable && idMap[c.fkTable]) c.fkTable = idMap[c.fkTable];
      });
    }
  });
  state.nodes = state.nodes.concat(newNodes);
  // No modo lógico as arestas nunca são coladas diretamente — são sempre recalculadas a partir
  // das colunas FK (rebuildLogicalEdges), e o remapeamento de fkTable acima já é suficiente.
  if (mode === "conceptual" && clipboard.edges.length){
    var newEdges = clipboard.edges.map(function(e){
      var clone = JSON.parse(JSON.stringify(e));
      clone.id = uid("ed");
      clone.from = idMap[e.from] || e.from;
      clone.to = idMap[e.to] || e.to;
      return clone;
    });
    state.edges = state.edges.concat(newEdges);
  }
  selectedNodeIds = new Set(newNodes.map(function(n){ return n.id; }));
  selectedEdgeIds = new Set();
  render();
  showToast(newNodes.length === 1 ? "1 elemento colado." : newNodes.length + " elementos colados.");
}
