<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Relógio</title>
<style>
  :root {
    --bg: #f4f6fa;
    --card: #ffffff;
    --text: #1c2333;
    --muted: #6b7488;
    --accent: #2f6fed;
    --border: #dde2ec;
    --shadow: 0 6px 24px rgba(20, 30, 60, .08);
    /* --z = zoom do navegador (Ctrl + scroll), calculado em JS; 1 = zoom normal */
    --z: 1;
    --vw: calc(1vw * var(--z));
    --vh: calc(1vh * var(--z));
  }
  :root[data-theme="dark"] {
    --bg: #0f1420;
    --card: #1a2133;
    --text: #eef1f8;
    --muted: #94a0b8;
    --accent: #6c9bff;
    --border: #2a3350;
    --shadow: 0 6px 24px rgba(0, 0, 0, .4);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: calc(2 * var(--vh)) calc(3 * var(--vw));
    transition: background .25s, color .25s;
  }
  /* Tudo é dimensionado pela largura (vw) e altura (vh) da janela,
     então ao maximizar o navegador a página se ajusta e mostra todas as informações. */
  .topbar {
    width: 100%;
    max-width: 1800px;
    display: flex;
    justify-content: flex-end;
    gap: 8px;
  }
  .topbar button { font-size: min(calc(1.6 * var(--vw)), calc(2.4 * var(--vh))); padding: .4em .9em; }
  button {
    font: inherit;
    cursor: pointer;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    border-radius: 999px;
    padding: 8px 16px;
    transition: background .2s, border-color .2s;
  }
  button:hover { border-color: var(--accent); }
  main {
    width: 100%;
    max-width: 1800px;
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: calc(2.5 * var(--vh));
  }
  #titulo {
    width: 100%;
    text-align: center;
    font-size: min(calc(5 * var(--vw)), calc(7.5 * var(--vh)));
    font-weight: 700;
    color: var(--text);
    background: transparent;
    border: 2px dashed transparent;
    border-radius: 12px;
    padding: .1em .4em;
    outline: none;
  }
  #titulo:hover, #titulo:focus { border-color: var(--border); }
  #titulo::placeholder { color: var(--muted); }
  .dica { margin: calc(-1.5 * var(--vh)) 0 0; font-size: min(calc(1.4 * var(--vw)), calc(2 * var(--vh))); color: var(--muted); }
  #relogio {
    font-family: ui-monospace, "SF Mono", Consolas, "Courier New", monospace;
    font-variant-numeric: tabular-nums;
    font-weight: 700;
    font-size: min(calc(14 * var(--vw)), calc(21 * var(--vh)));
    line-height: 1;
    letter-spacing: .02em;
    color: var(--accent);
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: .25em .4em;
    box-shadow: var(--shadow);
  }
  #data {
    font-size: min(calc(3.5 * var(--vw)), calc(5 * var(--vh)));
    font-weight: 600;
    color: var(--muted);
    text-align: center;
  }
  .horas {
    width: 100%;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: calc(1.5 * var(--vw));
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: calc(1.6 * var(--vh)) calc(1.6 * var(--vw));
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    gap: calc(1.2 * var(--vh));
  }
  .card label { font-weight: 600; color: var(--muted); font-size: min(calc(1.8 * var(--vw)), calc(2.8 * var(--vh))); }
  .card input[type="time"] {
    font: inherit;
    font-size: min(calc(4.5 * var(--vw)), calc(7 * var(--vh)));
    font-weight: 600;
    text-align: center;
    color: var(--text);
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: .1em;
    width: 100%;
    color-scheme: light;
  }
  :root[data-theme="dark"] .card input[type="time"] { color-scheme: dark; }
  .card input[type="time"]::-webkit-calendar-picker-indicator { display: none; }
  .campo { position: relative; display: flex; gap: 8px; align-items: center; }
  .campo input { flex: 1; min-width: 0; }
  .relogio-btn { padding: .3em .5em; border-radius: 12px; font-size: min(calc(3 * var(--vw)), calc(5 * var(--vh))); line-height: 1; }
  .janela {
    position: absolute; bottom: calc(100% + 8px); left: 0; right: 0; z-index: 10;
    font-size: 16px;
    background: var(--card); border: 1px solid var(--border); border-radius: 16px;
    box-shadow: var(--shadow); padding: 12px;
  }
  .janela[hidden] { display: none; }
  .colunas { display: flex; gap: 8px; }
  .col { flex: 1; height: min(180px, 28vh); overflow-y: auto; position: relative; display: flex; flex-direction: column; gap: 4px; }
  .col button { border-radius: 8px; padding: 6px; border-color: transparent; }
  .col button.sel { background: var(--accent); border-color: var(--accent); color: #fff; }
  .acoes { display: flex; gap: 8px; margin-top: 10px; }
  .acoes button { flex: 1; padding: 8px 10px; border-radius: 10px; font-size: .9rem; }
  .acoes .agora { background: var(--accent); border-color: var(--accent); color: #fff; }
</style>
</head>
<body>
  <div class="topbar">
    <button id="tela" type="button" aria-label="Alternar tela inteira">⛶ Tela Inteira</button>
    <button id="tema" type="button" aria-label="Alternar modo claro/escuro">🌙 Modo Escuro</button>
  </div>

  <main>
    <input id="titulo" type="text" placeholder="Digite o título aqui" aria-label="Título" value="Título da Atividade">
    <p class="dica">Clique no título para editá-lo.</p>

    <div id="relogio" role="timer" aria-live="off">00:00:00</div>
    <div id="data" aria-live="off"></div>

    <section class="horas">
      <div class="card">
        <label for="inicio">Hora de Início</label>
        <div class="campo"><input id="inicio" type="time"></div>
      </div>
      <div class="card">
        <label for="saida">Hora da Saída</label>
        <div class="campo"><input id="saida" type="time"></div>
      </div>
      <div class="card">
        <label for="termino">Hora de Término</label>
        <div class="campo"><input id="termino" type="time"></div>
      </div>
    </section>
  </main>

<script>
  const $ = id => document.getElementById(id);
  const pad = n => String(n).padStart(2, "0");
  const guardar = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
  const ler = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };

  // Zoom do navegador (Ctrl + scroll): as unidades vw/vh compensam o zoom,
  // então medimos a mudança e aplicamos de volta para o relógio acompanhar.
  function ajustarZoom() {
    const dpr = window.devicePixelRatio || 1;
    let base = parseFloat(ler("dpr_base"));
    if (!base) { base = dpr; guardar("dpr_base", String(base)); }
    document.documentElement.style.setProperty("--z", (dpr / base).toFixed(3));
  }
  ajustarZoom();
  window.addEventListener("resize", ajustarZoom);

  // Relógio
  function atualizar() {
    const d = new Date();
    $("relogio").textContent = `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
    const dia = d.toLocaleDateString("pt-BR", { weekday: "long" });
    $("data").textContent = `${dia} ${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()}`;
  }
  atualizar();
  setInterval(atualizar, 250);

  // Título configurável
  const tituloSalvo = ler("titulo");
  if (tituloSalvo !== null) $("titulo").value = tituloSalvo;
  const ajustarTitulo = () => { document.title = $("titulo").value.trim() || "Relógio"; };
  $("titulo").addEventListener("input", () => { guardar("titulo", $("titulo").value); ajustarTitulo(); });
  ajustarTitulo();

  // Horas de início / saída / término
  // Cada campo tem um reloginho que abre uma janela com hora, minutos, Agora e Limpar
  const fecharJanelas = () => document.querySelectorAll(".janela").forEach(j => { j.hidden = true; });

  ["inicio", "saida", "termino"].forEach(id => {
    const input = $(id);
    const campo = input.parentElement;
    const salvo = ler("hora_" + id);
    if (salvo) input.value = salvo.slice(0, 5);

    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "relogio-btn";
    btn.textContent = "🕒";
    btn.setAttribute("aria-label", "Abrir seletor de hora");

    const janela = document.createElement("div");
    janela.className = "janela";
    janela.hidden = true;
    janela.innerHTML =
      '<div class="colunas"><div class="col" data-col="h"></div><div class="col" data-col="m"></div></div>' +
      '<div class="acoes"><button type="button" class="agora">Agora</button><button type="button" class="limpar">Limpar</button></div>';
    campo.append(btn, janela);

    const colH = janela.querySelector('[data-col="h"]');
    const colM = janela.querySelector('[data-col="m"]');
    const opcao = n => {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = pad(n);
      b.dataset.v = n;
      return b;
    };
    for (let i = 0; i < 24; i++) colH.append(opcao(i));
    for (let i = 0; i < 60; i++) colM.append(opcao(i));

    const valorAtual = () => input.value ? input.value.split(":").map(Number) : null;
    const marcar = () => {
      const v = valorAtual() || [-1, -1];
      colH.querySelectorAll("button").forEach(b => b.classList.toggle("sel", +b.dataset.v === v[0]));
      colM.querySelectorAll("button").forEach(b => b.classList.toggle("sel", +b.dataset.v === v[1]));
    };
    const definir = (h, m) => {
      input.value = `${pad(h)}:${pad(m)}`;
      guardar("hora_" + id, input.value);
      marcar();
    };

    input.addEventListener("input", () => { guardar("hora_" + id, input.value); marcar(); });
    colH.addEventListener("click", e => {
      const b = e.target.closest("button");
      if (b) definir(+b.dataset.v, valorAtual() ? valorAtual()[1] : 0);
    });
    colM.addEventListener("click", e => {
      const b = e.target.closest("button");
      if (b) definir(valorAtual() ? valorAtual()[0] : new Date().getHours(), +b.dataset.v);
    });
    janela.querySelector(".agora").addEventListener("click", () => {
      const d = new Date();
      definir(d.getHours(), d.getMinutes());
      janela.hidden = true;
    });
    janela.querySelector(".limpar").addEventListener("click", () => {
      input.value = "";
      guardar("hora_" + id, "");
      marcar();
      janela.hidden = true;
    });
    btn.addEventListener("click", e => {
      e.stopPropagation();
      const abrir = janela.hidden;
      fecharJanelas();
      if (!abrir) return;
      janela.hidden = false;
      marcar();
      [colH, colM].forEach(col => {
        const sel = col.querySelector(".sel");
        col.scrollTop = sel ? sel.offsetTop - col.clientHeight / 2 + sel.offsetHeight / 2 : 0;
      });
    });
  });
  document.addEventListener("click", e => { if (!e.target.closest(".campo")) fecharJanelas(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape") fecharJanelas(); });

  // Tela inteira (botão ou tecla F)
  function alternarTela() {
    if (document.fullscreenElement) {
      document.exitFullscreen();
    } else if (document.documentElement.requestFullscreen) {
      document.documentElement.requestFullscreen().catch(() => {});
    }
  }
  $("tela").addEventListener("click", alternarTela);
  document.addEventListener("keydown", e => {
    if ((e.key === "f" || e.key === "F") && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)) alternarTela();
  });
  document.addEventListener("fullscreenchange", () => {
    const cheia = !!document.fullscreenElement;
    document.documentElement.classList.toggle("cheia", cheia);
    $("tela").textContent = cheia ? "✕ Sair da Tela Inteira" : "⛶ Tela Inteira";
  });

  // Modo claro / escuro
  function aplicarTema(t) {
    document.documentElement.setAttribute("data-theme", t);
    $("tema").textContent = t === "dark" ? "☀️ Modo Claro" : "🌙 Modo Escuro";
  }
  const temaSalvo = ler("tema");
  aplicarTema(temaSalvo || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));
  $("tema").addEventListener("click", () => {
    const novo = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
    aplicarTema(novo);
    guardar("tema", novo);
  });
</script>
</body>
</html>
