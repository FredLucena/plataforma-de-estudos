<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel do Professor — O Mistério da Tabela Perdida</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Cinzel+Decorative:wght@700&family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07060c;--bg2:#0e0c16;--panel:#16121f;--panel2:#1d1829;--panel3:#251f33;
  --ouro:#c9a24b;--ouro2:#f1d78a;--ouro3:#8a6d28;
  --vinho:#7a1f33;--vinho2:#a52a45;
  --perg:#eadfc2;--perg2:#d9c9a0;--tinta:#2b2118;
  --txt:#e8e2d4;--mut:#a39bb2;--linha:#3a3250;
  --ok:#4caf7a;--err:#e0574f;--azul:#6a8be0;
  --f-titulo:'Cinzel','Cinzel Decorative',Georgia,serif;
  --f-corpo:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  --f-maq:'Special Elite','Courier New',monospace;
  --f-ui:'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:var(--f-corpo);font-size:19px;font-weight:600;line-height:1.4}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
h1,h2,h3,h4{font-family:var(--f-titulo);font-weight:700;margin:0;letter-spacing:.04em}
a{color:var(--ouro2)}
code{font-family:'Consolas','Courier New',monospace;font-size:.88em;background:rgba(201,162,75,.14);border:1px solid rgba(201,162,75,.28);padding:0 .35em;border-radius:4px;color:inherit;white-space:pre-wrap;word-break:break-word}
pre{font-family:'Consolas','Courier New',monospace;font-size:.85em;background:rgba(0,0,0,.35);border:1px solid rgba(201,162,75,.3);padding:.7em .9em;border-radius:6px;overflow:auto;margin:.5em 0;white-space:pre-wrap}

/* Botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5em;cursor:pointer;
  font-family:var(--f-titulo);font-weight:700;font-size:.82rem;letter-spacing:.12em;text-transform:uppercase;
  padding:.8em 1.4em;border-radius:3px;border:1px solid var(--ouro);color:var(--ouro2);
  background:linear-gradient(180deg,rgba(201,162,75,.16),rgba(201,162,75,.04));
  transition:transform .15s,box-shadow .2s,background .2s,filter .2s;text-decoration:none;user-select:none}
.btn:hover:not(:disabled){background:linear-gradient(180deg,rgba(241,215,138,.28),rgba(201,162,75,.1));box-shadow:0 0 18px rgba(201,162,75,.35);transform:translateY(-1px)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.primario{background:linear-gradient(180deg,#d9b55c,#9c7a2d);color:#1a1208;border-color:#f1d78a;text-shadow:0 1px 0 rgba(255,255,255,.3)}
.btn.primario:hover:not(:disabled){background:linear-gradient(180deg,#f1d78a,#b38f3a);box-shadow:0 0 24px rgba(241,215,138,.5)}
.btn.perigo{border-color:var(--vinho2);color:#ff9aa9;background:linear-gradient(180deg,rgba(165,42,69,.2),rgba(165,42,69,.05))}
.btn.pequeno{font-size:.7rem;padding:.55em 1em}
.btn.fantasma{border-color:var(--linha);color:var(--mut);background:transparent}

/* Toast */
#toasts{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:#1c1628;border:1px solid var(--ouro);color:var(--ouro2);padding:.6em 1.2em;border-radius:4px;font-family:var(--f-ui);font-size:.85rem;box-shadow:0 8px 30px rgba(0,0,0,.6);animation:toastIn .3s ease,toastOut .4s ease 2.6s forwards}
.toast.err{border-color:var(--err);color:#ffb3ad}
@keyframes toastIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateY(8px)}}

/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(3,2,8,.78);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:1000;padding:16px;animation:fadeIn .25s ease}
.modal-bg.topo{z-index:1100}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{max-height:calc(100vh - 32px);overflow:auto;animation:subir .3s ease}
@keyframes subir{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}

/* Pergaminho */
.perg{background:
  radial-gradient(ellipse at 20% 10%,rgba(255,255,255,.35),transparent 55%),
  radial-gradient(ellipse at 90% 100%,rgba(120,80,30,.28),transparent 60%),
  linear-gradient(180deg,var(--perg),var(--perg2));
  color:var(--tinta);border:2px solid #7a5d2a;border-radius:6px;
  box-shadow:0 0 0 4px #1a1208,0 0 0 5px var(--ouro3),0 30px 70px rgba(0,0,0,.75),inset 0 0 70px rgba(110,70,20,.35)}
.perg h3,.perg h2{color:#4a1520}
.perg code{background:rgba(122,31,51,.1);border-color:rgba(122,31,51,.35);color:#4a1520}
.perg pre{background:rgba(43,33,24,.1);border-color:rgba(122,31,51,.35);color:var(--tinta)}

/* Formulários (usados principalmente no módulo do professor) */
label.campo{display:block;margin-bottom:14px;font-family:var(--f-ui);font-size:.82rem;color:var(--mut);font-weight:600;letter-spacing:.02em}
label.campo>span{display:block;margin-bottom:5px}
.in,input[type=text],input[type=number],textarea,select{width:100%;background:#0d0a14;border:1px solid var(--linha);border-radius:4px;padding:.6em .8em;color:var(--txt);font-family:var(--f-ui);font-size:.95rem;font-weight:400;outline:none;transition:border-color .2s,box-shadow .2s}
input:focus,textarea:focus,select:focus{border-color:var(--ouro);box-shadow:0 0 0 3px rgba(201,162,75,.18)}
textarea{resize:vertical;min-height:80px;line-height:1.45}
::selection{background:rgba(201,162,75,.4)}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-track{background:#0d0a14}::-webkit-scrollbar-thumb{background:#3a3250;border-radius:6px}::-webkit-scrollbar-thumb:hover{background:var(--ouro3)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
input[type=file]{font-family:var(--f-ui);font-size:.82rem;color:var(--mut)}
input[type=file]::file-selector-button{font-family:var(--f-titulo);font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--ouro2);background:linear-gradient(180deg,rgba(201,162,75,.16),rgba(201,162,75,.04));border:1px solid var(--ouro);border-radius:3px;padding:.6em 1em;margin-right:10px;cursor:pointer}
input[type=file]::file-selector-button:hover{background:rgba(241,215,138,.25)}

body{font-family:var(--f-ui);font-weight:400;font-size:15px;background:radial-gradient(ellipse at 50% -10%,#1d1630,#07060c 60%) fixed}
.topo{display:flex;align-items:center;gap:16px;padding:14px 24px;border-bottom:1px solid var(--ouro3);background:linear-gradient(180deg,#14101f,#0b0913);position:sticky;top:0;z-index:50;flex-wrap:wrap}
.marca{display:flex;align-items:center;gap:12px}
.marca .logo{font-size:2rem;filter:drop-shadow(0 0 10px rgba(201,162,75,.5))}
.marca h1{font-family:'Cinzel Decorative',var(--f-titulo);font-size:1.15rem;background:linear-gradient(180deg,#fff3c4,#c9a24b);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:.06em}
.marca small{display:block;color:var(--mut);font-family:var(--f-ui);font-size:.74rem;letter-spacing:.08em}
nav.abas{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
nav.abas button{background:none;border:1px solid transparent;color:var(--mut);font-family:var(--f-titulo);font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;padding:.7em 1.1em;cursor:pointer;border-radius:3px;transition:.2s;font-weight:700}
nav.abas button:hover{color:var(--ouro2)}
nav.abas button.at{color:var(--ouro2);border-color:var(--ouro3);background:rgba(201,162,75,.1)}
nav.abas .n{display:inline-block;margin-left:.4em;background:var(--ouro);color:#1a1208;border-radius:9px;padding:0 .5em;font-size:.68rem;font-family:var(--f-ui)}
main{max-width:1180px;margin:0 auto;padding:26px 22px 60px}
h2.sec{font-family:var(--f-titulo);color:var(--ouro2);font-size:1.25rem;margin:0 0 4px}
p.lead{color:var(--mut);margin:0 0 20px;line-height:1.5}
.pan{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--linha);border-radius:8px;padding:18px 20px;margin-bottom:18px}
.pan h3{font-family:var(--f-titulo);font-size:.82rem;letter-spacing:.16em;color:var(--ouro);text-transform:uppercase;margin-bottom:12px}
.grid{display:grid;gap:14px}.g4{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.kpi{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--linha);border-radius:8px;padding:16px;text-align:center}
.kpi b{display:block;font-family:var(--f-titulo);font-size:1.9rem;color:var(--ouro2)}.kpi span{color:var(--mut);font-size:.8rem}
.passos{counter-reset:p;list-style:none;padding:0;margin:0;display:grid;gap:10px}
.passos li{counter-increment:p;display:flex;gap:14px;align-items:flex-start;line-height:1.5}
.passos li::before{content:counter(p);flex:none;width:28px;height:28px;border-radius:50%;background:var(--ouro);color:#1a1208;font-family:var(--f-titulo);font-weight:700;display:flex;align-items:center;justify-content:center;font-size:.85rem}
.alerta{border:1px solid var(--ouro3);background:rgba(201,162,75,.08);border-radius:6px;padding:10px 14px;margin-bottom:8px;display:flex;gap:10px;line-height:1.45}
.alerta.err{border-color:var(--err);background:rgba(224,87,79,.08)}.alerta.ok{border-color:var(--ok);background:rgba(76,175,122,.08)}
.barra-acoes{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.barra-acoes .esp{flex:1}
.q-layout{display:grid;grid-template-columns:250px 1fr;gap:18px;align-items:start}
@media(max-width:860px){.q-layout{grid-template-columns:1fr}}
.salas-lista{display:flex;flex-direction:column;gap:6px;position:sticky;top:88px}
.sala-b{display:flex;align-items:center;gap:10px;text-align:left;background:var(--panel);border:1px solid var(--linha);border-radius:6px;padding:10px 12px;cursor:pointer;color:var(--txt);transition:.15s}
.sala-b:hover{border-color:var(--ouro3)}.sala-b.at{border-color:var(--ouro);background:rgba(201,162,75,.1)}
.sala-b .i{font-size:1.4rem}.sala-b .t{flex:1;line-height:1.25;font-size:.85rem}.sala-b .t small{display:block;color:var(--mut);font-size:.72rem}
.sala-b .c{font-family:var(--f-titulo);background:#0d0a14;border:1px solid var(--linha);border-radius:12px;padding:.1em .7em;font-size:.8rem;color:var(--ouro2)}
.sala-b .c.baixo{border-color:var(--err);color:#ffb3ad}
.q-card{background:var(--panel);border:1px solid var(--linha);border-radius:8px;padding:14px 16px;margin-bottom:12px}
.q-card:hover{border-color:var(--ouro3)}
.q-card .cab{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.tag{font-size:.7rem;border:1px solid var(--linha);border-radius:10px;padding:.1em .7em;color:var(--mut);white-space:nowrap}
.tag.n1{color:#8fe0b0;border-color:#2e7a52}.tag.n2{color:#f1d78a;border-color:var(--ouro3)}.tag.n3{color:#ffb3ad;border-color:#a5423b}
.q-card .enun{font-size:1rem;line-height:1.5;margin-bottom:10px}
.q-card ol{list-style:upper-alpha;margin:0 0 8px;padding-left:1.6em;display:grid;gap:3px;color:#cfc6dc}
.q-card li.c{color:#8fe0b0;font-weight:600}.q-card li.c::marker{font-weight:700}
.q-card .exp{border-top:1px dashed var(--linha);padding-top:8px;font-size:.86rem;color:var(--mut);line-height:1.45}
.q-card .btns{display:flex;gap:6px;margin-left:auto}
.vazio{color:var(--mut);text-align:center;padding:36px 12px;border:1px dashed var(--linha);border-radius:8px}
.form-linha{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.alt{display:flex;gap:8px;align-items:center;margin-bottom:8px}.alt input[type=radio]{accent-color:var(--ouro);width:18px;height:18px;flex:none}
.alt .L{font-family:var(--f-titulo);color:var(--ouro);width:18px;flex:none}
.modal.form{width:min(720px,96vw);background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--ouro3);border-radius:8px;padding:22px 26px;box-shadow:0 30px 80px rgba(0,0,0,.7)}
.modal.form h3{color:var(--ouro2);font-size:1.05rem;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
.modal.form .fechar{background:none;border:none;color:var(--mut);font-size:1.6rem;cursor:pointer;line-height:1}
.prev{background:#0d0a14;border:1px solid var(--linha);border-radius:4px;padding:8px 12px;font-size:.9rem;line-height:1.45;margin-top:-6px;margin-bottom:12px;color:#cfc6dc}
.prev:empty{display:none}
table.t{width:100%;border-collapse:collapse;font-size:.86rem}
table.t th{font-family:var(--f-titulo);font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ouro);text-align:left;padding:9px 10px;border-bottom:1px solid var(--ouro3);white-space:nowrap;cursor:pointer}
table.t td{padding:9px 10px;border-bottom:1px solid var(--linha);vertical-align:middle}
table.t tr:hover td{background:rgba(255,255,255,.03)}
.tw{overflow-x:auto;border:1px solid var(--linha);border-radius:8px}
.pill{display:inline-block;border-radius:10px;padding:.1em .7em;font-size:.78rem;font-weight:600}
.pill.a{background:rgba(76,175,122,.18);color:#8fe0b0}.pill.m{background:rgba(201,162,75,.18);color:#f1d78a}.pill.b{background:rgba(224,87,79,.18);color:#ffb3ad}
.barra{height:9px;background:#0d0a14;border:1px solid var(--linha);border-radius:5px;overflow:hidden;min-width:90px}.barra i{display:block;height:100%;background:linear-gradient(90deg,#8a6d28,#f1d78a)}
.barra.r i{background:linear-gradient(90deg,#a52a45,#e0574f)}.barra.v i{background:linear-gradient(90deg,#2e8a52,#6fdc9c)}
.linha-m{display:grid;grid-template-columns:210px 1fr 90px;gap:12px;align-items:center;margin-bottom:9px;font-size:.84rem}
@media(max-width:700px){.linha-m{grid-template-columns:1fr}}
.cx{display:flex;align-items:center;gap:8px;margin-bottom:10px}.cx input[type=checkbox]{accent-color:var(--ouro);width:18px;height:18px}
.cx label{cursor:pointer;line-height:1.35}
.cod{font-family:Consolas,monospace;font-size:.72rem;min-height:84px;word-break:break-all}
.det{background:#0d0a14}
.rodape{text-align:center;color:#6f6880;font-size:.74rem;padding:24px}.rodape b{color:var(--ouro2);font-weight:600}
.muted{color:var(--mut)}.sm{font-size:.82rem}
details.d summary{cursor:pointer;color:var(--ouro2);font-weight:600;padding:4px 0}
details.d[open] summary{margin-bottom:8px}
.ferr-tab td:first-child{font-size:1.1rem}
kbd{background:#0d0a14;border:1px solid var(--linha);border-radius:3px;padding:0 .4em;font-family:Consolas,monospace;font-size:.85em}
</style>
</head>
<body>
<header class="topo">
  <div class="marca"><span class="logo">🕵️</span><div><h1>Quartel-General</h1><small>PAINEL DO PROFESSOR</small></div></div>
  <nav class="abas" id="nav"></nav>
  <button class="btn pequeno fantasma" data-fs><span class="fsi">⛶</span> Tela inteira</button>
</header>
<main id="conteudo"></main>
<div class="rodape">Módulo do Professor · criado por <b>Prof. Fred Lucena</b> · os dados ficam salvos neste navegador (localStorage)</div>
<div id="modal-root"></div><div id="toasts"></div>

<script>
/* ===== O Mistério da Tabela Perdida — núcleo compartilhado (aluno + professor) ===== */
const DTP = (() => {

  /* ---------- Utilidades ---------- */
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  // Mini-formatação: `código`, ```bloco```, **negrito**, quebras de linha
  const fmt = s => {
    let t = esc(s);
    t = t.replace(/```([\s\S]*?)```/g, (m, c) => '<pre>' + c.trim() + '</pre>');
    t = t.replace(/`([^`\n]+)`/g, '<code>$1</code>');
    t = t.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
    return t.replace(/\n/g, '<br>');
  };
  const b64e = s => btoa(unescape(encodeURIComponent(s)));
  const b64d = s => decodeURIComponent(escape(atob(s.replace(/\s+/g, ''))));
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const fmtTempo = s => { s = Math.max(0, Math.round(s)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60; return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(x).padStart(2, '0'); };
  const lsGet = (k, d = null) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } };
  const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } };
  const lsDel = k => { try { localStorage.removeItem(k); } catch (e) {} };
  const hash = s => { let h = 5381; for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0; return (h >>> 0).toString(36); };
  const baixar = (nome, texto, mime = 'application/json') => {
    const b = new Blob([texto], { type: mime + ';charset=utf-8' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = nome;
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  };
  const copiar = async txt => {
    try { await navigator.clipboard.writeText(txt); return true; }
    catch (e) { const t = document.createElement('textarea'); t.value = txt; t.style.position = 'fixed'; t.style.opacity = '0'; document.body.appendChild(t); t.select(); let ok = false; try { ok = document.execCommand('copy'); } catch (_) {} t.remove(); return ok; }
  };
  const toast = (msg, err) => {
    let r = document.getElementById('toasts'); if (!r) { r = document.createElement('div'); r.id = 'toasts'; document.body.appendChild(r); }
    const d = document.createElement('div'); d.className = 'toast' + (err ? ' err' : ''); d.textContent = msg; r.appendChild(d); setTimeout(() => d.remove(), 3100);
  };

  /* ---------- Configuração padrão ---------- */
  const CONFIG_PADRAO = {
    titulo: 'O Mistério da Tabela Perdida',
    turma: '',
    caso: 'tabela',          // id do caso (ver CASOS)
    porSala: 2,              // desafios por sala (1 ou 2)
    embaralhar: true,        // embaralhar alternativas
    revelarGabarito: true,   // mostrar a resposta certa e a explicação após errar
    pontos: [100, 60, 30],   // pontos por 1ª, 2ª e demais tentativas
    bonusAcusacao: [200, 120, 60],
    penalidadeAcusacao: 50
  };

  /* ---------- Salas, ferramentas e pistas ---------- */
  const SALAS = [
    { id: 1, nome: 'Biblioteca', tema: 'Conceitos de Banco de Dados', ico: '📚',
      intro: 'Estantes empoeiradas guardam o livro de registros do servidor. Para abri-lo, prove que domina os fundamentos.',
      ferr: [
        { ico: '🔦', nome: 'Lanterna de Mão', uso: 'Amplia o alcance da sua luz pela mansão escura.',
          pista: 'Sob o feixe da lanterna, o livro de registros (log) do servidor: às 00h13 a tabela CLIENTES foi removida por inteiro — estrutura e dados sumiram, não apenas as linhas.' },
        { ico: '📖', nome: 'Manual do SGBD', uso: 'Explica quem pode fazer o quê no sistema.',
          pista: 'O manual afirma: remover tabelas exige privilégio de administrador (DBA). Contas comuns só consultam ou alteram registros.' }] },
    { id: 2, nome: 'Sala de Jantar', tema: 'Modelagem Entidade-Relacionamento', ico: '🍷',
      intro: 'A mesa ainda está posta. Os convidados da festa de ontem deixaram álibis… e muitas perguntas.',
      ferr: [
        { ico: '📜', nome: 'Lista de Convidados', uso: 'Registra quem esteve onde durante a festa.',

function importarBanco(f) {
  if (!f) return; const r = new FileReader();
  r.onload = () => {
    try {
      const o = JSON.parse(r.result), arr = Array.isArray(o) ? o : (o.questoes || o.banco); if (!Array.isArray(arr)) throw new Error('formato inesperado');
      const ok = arr.filter(DTP.validarQuestao).map(q => Object.assign({ nivel: 2, e: '' }, q)); if (!ok.length) throw new Error('nenhuma questão válida');
      const substituir = confirm(`${ok.length} questões válidas encontradas.\n\nOK = SUBSTITUIR o banco atual\nCancelar = ADICIONAR ao banco atual`);
      if (substituir) BANCO = ok; else { const ids = new Set(BANCO.map(q => q.id)); ok.forEach(q => { if (ids.has(q.id)) q.id = uid(); BANCO.push(q); }); }
      salvarBanco(); toast('Banco importado.'); render();
    } catch (e) { toast('Arquivo inválido: ' + e.message, true); }
  }; r.readAsText(f); $('#f-imp').value = '';
}

/* =====================================================================
   RESULTADOS
   ===================================================================== */
function agregados(lista) {
  const porQ = {}, porS = {};
  lista.forEach(r => { const st = statsRes(r); Object.entries(st.first).forEach(([q, ok]) => { porQ[q] = porQ[q] || { n: 0, a1: 0 }; porQ[q].n++; porQ[q].a1 += ok; });
    Object.entries(st.porSala).forEach(([s, v]) => { porS[s] = porS[s] || { n: 0, a1: 0 }; porS[s].n += v.n; porS[s].a1 += v.a1; }); });
  return { porQ, porS };
}
function filtrados() {
  return RES.filter(r => (!filtroTurma || (r.turma || '') === filtroTurma) && (!filtroNome || (r.nome || '').toLowerCase().includes(filtroNome)))
    .map(r => Object.assign({}, r, { _s: statsRes(r), _p: pctRes(r) }));
}
function vResultados() {
  const turmas = [...new Set(RES.map(r => r.turma || '').filter(Boolean))].sort();
  const L = filtrados(), ag = agregados(L);
  const chave = { nome: r => (r.nome || '').toLowerCase(), turma: r => (r.turma || '').toLowerCase(), pontos: r => r._p, a1: r => r._s.qs ? r._s.a1 / r._s.qs : 0, erros: r => r._s.erros, tempo: r => r.tempo, data: r => r.fim || 0 }[ordem.k];
  L.sort((a, b) => { const x = chave(a), y = chave(b); return (x > y ? 1 : x < y ? -1 : 0) * ordem.d; });
  const media = L.length ? Math.round(L.reduce((a, r) => a + r._p, 0) / L.length) : null;
  const a1m = L.length ? Math.round(L.reduce((a, r) => a + (r._s.qs ? r._s.a1 / r._s.qs : 0), 0) / L.length * 100) : null;
  const tmed = L.length ? Math.round(L.reduce((a, r) => a + (r.tempo || 0), 0) / L.length) : null;
  const dificeis = Object.entries(ag.porQ).map(([id, v]) => ({ id, ...v, taxa: v.a1 / v.n })).filter(x => x.n >= 1).sort((a, b) => a.taxa - b.taxa || b.n - a.n).slice(0, 8);
  const th = (k, t) => `<th data-o="${k}">${t}${ordem.k === k ? (ordem.d > 0 ? ' ▲' : ' ▼') : ''}</th>`;
  $('#conteudo').innerHTML = `
    <h2 class="sec">Resultados da turma</h2>
    <p class="lead">Importe os relatórios entregues pelos alunos (arquivo <code>.json</code> ou código <code>RES1.…</code>). Resultados de jogos feitos neste navegador entram automaticamente.</p>
    <div class="pan"><h3>Importar relatórios</h3>
      <textarea id="r-txt" class="cod" placeholder="Cole aqui um ou vários códigos RES1.… (um por linha)"></textarea>
      <div class="barra-acoes" style="margin:10px 0 0"><input type="file" id="r-arq" accept=".json" multiple style="max-width:320px"><span class="esp"></span><button class="btn primario pequeno" id="r-imp">Importar</button></div></div>
    ${RES.length ? `
    <div class="grid g4" style="margin-bottom:18px">
      <div class="kpi"><b>${L.length}</b><span>alunos${filtroTurma || filtroNome ? ' (filtrados)' : ''}</span></div>
      <div class="kpi"><b>${media}%</b><span>aproveitamento médio</span></div>
      <div class="kpi"><b>${a1m}%</b><span>acertos de 1ª tentativa</span></div>
      <div class="kpi"><b>${fmtTempo(tmed || 0)}</b><span>tempo médio</span></div>
    </div>
    <div class="grid g2">
      <div class="pan"><h3>Desempenho por tópico (acerto na 1ª tentativa)</h3>
        ${SALAS_Q.map(s => { const v = ag.porS[s.id]; const p = v && v.n ? Math.round(v.a1 / v.n * 100) : null; return `<div class="linha-m"><div>${s.ico} ${esc(s.tema)}</div><div class="barra ${p == null ? '' : p < 50 ? 'r' : p >= 75 ? 'v' : ''}"><i style="width:${p || 0}%"></i></div><div>${p == null ? '—' : p + '%'} <span class="muted">(${v ? v.n : 0})</span></div></div>`; }).join('')}</div>
      <div class="pan"><h3>Questões mais erradas</h3>
        ${dificeis.length ? `<div class="tw"><table class="t"><thead><tr><th>Questão</th><th>1ª tent.</th><th>n</th></tr></thead><tbody>${dificeis.map(d => { const q = qPorId(d.id); const p = Math.round(d.taxa * 100); return `<tr><td>${q ? `<span class="muted sm">${SALAS[q.sala - 1].ico}</span> ${fmt(q.q.length > 110 ? q.q.slice(0, 110) + '…' : q.q)}` : '<i class="muted">(questão removida do banco)</i>'}</td><td><span class="pill ${classePct(p)}">${p}%</span></td><td>${d.n}</td></tr>`; }).join('')}</tbody></table></div>` : '<div class="vazio">Sem dados.</div>'}</div>
    </div>
    <div class="pan"><h3>Alunos</h3>
      <div class="barra-acoes">
        <input type="text" id="r-busca" placeholder="Buscar aluno…" value="${esc(filtroNome)}" style="max-width:240px">
        <select id="r-turma" style="max-width:240px"><option value="">Todas as turmas</option>${turmas.map(t => `<option ${t === filtroTurma ? 'selected' : ''}>${esc(t)}</option>`).join('')}</select>
        <span class="esp"></span>
        <button class="btn pequeno" id="r-csv">⬇ Exportar CSV (Excel)</button><button class="btn pequeno" id="r-json">⬇ JSON</button><button class="btn pequeno perigo" id="r-limpar">Limpar tudo</button>
      </div>
      <div class="tw"><table class="t"><thead><tr>${th('nome', 'Aluno')}${th('turma', 'Turma')}${th('pontos', 'Pontos')}${th('a1', '1ª tentativa')}${th('erros', 'Erros')}${th('tempo', 'Tempo')}${th('data', 'Data')}<th></th></tr></thead><tbody>
      ${L.map(r => `<tr><td><b>${esc(r.nome || '—')}</b>${r.mat ? `<br><span class="muted sm">${esc(r.mat)}</span>` : ''}</td><td>${esc(r.turma || '—')}</td>
        <td><span class="pill ${classePct(r._p)}">${r.pontos}/${r.max} · ${r._p}%</span></td><td>${r._s.a1}/${r._s.qs}</td><td>${r._s.erros}${r.acusErr ? ` <span class="muted sm">(+${r.acusErr} acus.)</span>` : ''}</td><td>${fmtTempo(r.tempo || 0)}</td><td class="sm muted">${dataBR(r.fim)}</td>
        <td style="white-space:nowrap"><button class="btn pequeno" data-v="${esc(r.rid)}">Detalhes</button> <button class="btn pequeno perigo" data-x="${esc(r.rid)}">✕</button></td></tr>`).join('') || '<tr><td colspan="8" class="muted" style="text-align:center;padding:20px">Nenhum aluno com esses filtros.</td></tr>'}
      </tbody></table></div></div>` : '<div class="vazio">Ainda não há resultados. Importe relatórios acima ou jogue uma partida de teste no módulo do aluno.</div>'}`;
  $('#r-imp').onclick = importarResultados;
  $('#r-arq').onchange = async e => { const fs = [...e.target.files]; const txt = (await Promise.all(fs.map(f => f.text()))).join('\n@@@\n'); $('#r-txt').value = (($('#r-txt').value ? $('#r-txt').value + '\n' : '') + txt); toast(fs.length + ' arquivo(s) carregado(s). Clique em Importar.'); };
  if (!RES.length) return;
  $('#r-busca').oninput = e => { filtroNome = e.target.value.toLowerCase(); const p = e.target.selectionStart; vResultados(); const i = $('#r-busca'); i.focus(); i.setSelectionRange(p, p); };
  $('#r-turma').onchange = e => { filtroTurma = e.target.value; vResultados(); };
  document.querySelectorAll('th[data-o]').forEach(h => h.onclick = () => { const k = h.dataset.o; ordem = { k, d: ordem.k === k ? -ordem.d : (k === 'nome' || k === 'turma' ? 1 : -1) }; vResultados(); });
  document.querySelectorAll('[data-v]').forEach(b => b.onclick = () => detalhes(b.dataset.v));
  document.querySelectorAll('[data-x]').forEach(b => b.onclick = () => { if (confirm('Remover este resultado?')) { RES = RES.filter(r => r.rid !== b.dataset.x); salvarRes(); render(); } });
  $('#r-csv').onclick = () => exportarCSV(L);
  $('#r-json').onclick = () => baixar('resultados.json', JSON.stringify(RES, null, 1));
  $('#r-limpar').onclick = () => { if (confirm('Apagar TODOS os resultados importados deste navegador?')) { RES = []; salvarRes(); render(); } };
}
function importarResultados() {
  const txt = $('#r-txt').value.trim(); if (!txt) return toast('Cole um código ou carregue arquivos primeiro.', true);
  const partes = []; txt.split('@@@').forEach(bloco => { bloco = bloco.trim(); if (!bloco) return; if (bloco.startsWith('{') || bloco.startsWith('[')) partes.push(bloco); else bloco.split(/\s*\n\s*/).forEach(l => { if (l.trim()) partes.push(l.trim()); }); });
  let novos = 0, atual = 0, erros = 0;
  partes.forEach(p => {
    try {
      let lote; if (p.startsWith('[')) lote = JSON.parse(p); else lote = [DTP.lerRelatorio(p)];
      lote.forEach(r => { if (!r || r.t !== 'dtp-res' || !Array.isArray(r.log)) { erros++; return; } const i = RES.findIndex(x => x.rid === r.rid); if (i >= 0) { RES[i] = r; atual++; } else { RES.push(r); novos++; } });
    } catch (e) { erros++; }
  });
  salvarRes(); toast(`${novos} novo(s), ${atual} atualizado(s)${erros ? `, ${erros} inválido(s)` : ''}.`, !!erros && !novos && !atual); render();
}
function detalhes(rid) {
  const r = RES.find(x => x.rid === rid); if (!r) return; const st = statsRes(r);
  const erradas = Object.entries(st.first).filter(([, ok]) => !ok).map(([q]) => q);
  const tent = {}; r.log.forEach(([q, s, o]) => { tent[q] = (tent[q] || 0) + 1; });
  modal(`<h3>${esc(r.nome)} <button class="fechar" aria-label="Fechar">×</button></h3>
    <p class="muted sm">${esc(r.turma || '')} ${r.mat ? '· matrícula ' + esc(r.mat) : ''} · ${esc(r.missao || '')} · ${dataBR(r.fim)} · tempo ${fmtTempo(r.tempo || 0)} · acusações erradas: ${r.acusErr || 0}</p>
    <div class="grid g4" style="margin:12px 0"><div class="kpi"><b>${r.pontos}</b><span>de ${r.max} pontos</span></div><div class="kpi"><b>${st.a1}/${st.qs}</b><span>acertos de 1ª</span></div><div class="kpi"><b>${st.erros}</b><span>respostas erradas</span></div></div>
    <h3 style="font-size:.74rem;color:var(--ouro);letter-spacing:.14em;margin:14px 0 8px">POR TÓPICO</h3>
    ${SALAS_Q.filter(s => st.porSala[s.id]).map(s => { const v = st.porSala[s.id], p = Math.round(v.a1 / v.n * 100); return `<div class="linha-m"><div>${s.ico} ${esc(s.tema)}</div><div class="barra ${p < 50 ? 'r' : p >= 75 ? 'v' : ''}"><i style="width:${p}%"></i></div><div>${v.a1}/${v.n}</div></div>`; }).join('')}
    <h3 style="font-size:.74rem;color:var(--ouro);letter-spacing:.14em;margin:14px 0 8px">QUESTÕES ERRADAS NA 1ª TENTATIVA</h3>
    ${erradas.length ? erradas.map(id => { const q = qPorId(id); return `<div class="q-card" style="padding:10px 14px">${q ? `<div class="enun" style="margin:0 0 6px">${fmt(q.q)}</div><div class="muted sm">Resposta certa: <b style="color:#8fe0b0">${fmt(q.o[q.c])}</b> · tentativas: ${tent[id]}</div>` : `<i class="muted">Questão ${esc(id)} (removida do banco)</i>`}</div>`; }).join('') : '<div class="alerta ok"><span>🎉</span><div>Acertou tudo de primeira.</div></div>'}`, 'form');
}
function exportarCSV(L) {
  const cab = ['Nome', 'Turma', 'Matrícula', 'Pontos', 'Máximo', 'Aproveitamento %', 'Questões respondidas', 'Acertos 1ª tentativa', 'Respostas erradas', 'Acusações erradas', 'Tempo (mm:ss)', 'Data', ...SALAS_Q.map(s => `Sala ${s.id} ${s.nome} (1ª/total)`)];
  const lin = L.map(r => [r.nome, r.turma, r.mat, r.pontos, r.max, r._p, r._s.qs, r._s.a1, r._s.erros, r.acusErr || 0, fmtTempo(r.tempo || 0), dataBR(r.fim), ...SALAS_Q.map(s => { const v = r._s.porSala[s.id]; return v ? `${v.a1}/${v.n}` : ''; })]);
  const csv = [cab, ...lin].map(l => l.map(c => { c = String(c ?? ''); return /[";\n]/.test(c) ? '"' + c.replace(/"/g, '""') + '"' : c; }).join(';')).join('\r\n');
  baixar('resultados_turma.csv', '﻿' + csv, 'text/csv'); toast('CSV exportado (abra no Excel).');
}

/* ---------- Início ---------- */
DTP.ligarTelaCheia();
render();
window.__prof = { get BANCO() { return BANCO; }, get RES() { return RES; } };
})();

</script>
</body>
</html>
